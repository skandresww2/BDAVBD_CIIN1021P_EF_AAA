<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador OLAP MoviTrack</title>
<style>
/* =====================================================================
   COLORES Y TEXTOS BASE  (el docente puede cambiar estos tokens)
   Marca UPN: Lúcuma #FDBA30 · Negro #000000
   Soporte digital: Morado #9500FF · Magenta #FF00DA · Cyan #00B9FF
   ===================================================================== */
:root{
  --lucuma:#FDBA30; --negro:#000000; --morado:#9500FF; --magenta:#FF00DA; --cyan:#00B9FF;

  --bg:#F2F2EF; --surface:#FFFFFF; --surface-2:#F7F7F4; --ink:#000000; --ink-2:#333331;
  --muted:#5E5E5A; --line:#DDDCD6; --line-strong:#B9B7AF;
  --hdr-bg:#000000; --hdr-ink:#FFFFFF; --hdr-muted:#B5B5B0;

  --concept:#8200DE; --concept-bg:#F5EDFF;
  --example:#00658F; --example-bg:#E5F6FE;
  --try-bg:#FFF6DF;
  --ok:#0B7A41; --ok-bg:#E1F3E8; --bad:#BF1238; --bad-bg:#FCE7EB; --info-bg:#EFEFEC;

  --code-bg:#1E1E1E; --code-ink:#D4D4D4; --code-kw:#569CD6; --code-fn:#DCDCAA; --code-str:#CE9178;
  --code-num:#B5CEA8; --code-cm:#6A9955; --code-par:#9CDCFE;

  /* Series de gráficos (validadas para daltonismo). s1 = derivado de Lúcuma */
  --s1:#C98A00; --s2:#0090D6; --s3:#9500FF;
  --dim:#00B9FF; --fact:#FDBA30; --etl-bad:#FF00DA;

  --f-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-disp:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-code:"Cascadia Mono",Consolas,"SF Mono",Menlo,"Liberation Mono",monospace;
  --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C0C0B; --surface:#161615; --surface-2:#1E1E1C; --ink:#F3F3F0; --ink-2:#D2D2CD;
    --muted:#A4A49E; --line:#2F2F2C; --line-strong:#4B4B47;
    --concept:#C686FF; --concept-bg:#221430; --example:#6FD0FF; --example-bg:#0A2431; --try-bg:#2A2110;
    --ok:#5FD49B; --ok-bg:#0F2E1E; --bad:#FF7F98; --bad-bg:#37121C; --info-bg:#232321;
    --s1:#BF8412; --s2:#0A94D6; --s3:#A247FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C0C0B; --surface:#161615; --surface-2:#1E1E1C; --ink:#F3F3F0; --ink-2:#D2D2CD;
  --muted:#A4A49E; --line:#2F2F2C; --line-strong:#4B4B47;
  --concept:#C686FF; --concept-bg:#221430; --example:#6FD0FF; --example-bg:#0A2431; --try-bg:#2A2110;
  --ok:#5FD49B; --ok-bg:#0F2E1E; --bad:#FF7F98; --bad-bg:#37121C; --info-bg:#232321;
  --s1:#BF8412; --s2:#0A94D6; --s3:#A247FF;
}
:root.proj{ --fs:19px; }

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--f-ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--morado);outline-offset:2px}
a{color:var(--concept)}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;line-height:1.15;margin:0}
p{margin:0 0 .7em;max-width:70ch}
code{font-family:var(--f-code);font-size:.88em;background:var(--info-bg);padding:.08em .35em;border-radius:3px}
small{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Cabecera ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr-bg);color:var(--hdr-ink);border-bottom:5px solid var(--lucuma)}
.hdr-in{display:flex;align-items:center;gap:18px;padding:10px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-family:var(--f-disp);font-size:1.05rem;letter-spacing:.01em}
.brand b span{color:var(--lucuma)}
.brand small{color:var(--hdr-muted);font-size:.78rem}
.where{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.where-t{font-size:.84rem;color:var(--hdr-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-t b{color:var(--hdr-ink);font-weight:600}
.bar{height:7px;background:#2B2B2A;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lucuma);transition:width .35s ease}
.pct{font-weight:700;font-size:.9rem;min-width:3.4em;text-align:right}
.hbtn{border:1.5px solid #555;background:transparent;color:var(--hdr-ink);border-radius:6px;padding:5px 10px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.hbtn[aria-pressed="true"]{background:var(--lucuma);border-color:var(--lucuma);color:#000}
.menu-btn{display:none}

/* ---------- Estructura ---------- */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;max-width:1440px;margin:0 auto;padding-block:22px 80px;padding-inline:20px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.mod{margin-bottom:6px}
.mod-btn{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer}
.mod-btn:hover{background:var(--surface)}
.mod-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;border:2px solid var(--ink)}
.mod.cur .mod-n{background:var(--lucuma);border-color:var(--lucuma);color:#000}
.mod.full .mod-n{background:var(--ink);color:var(--bg)}
.mod-t{font-weight:600;font-size:.95rem;line-height:1.2}
.mod-t small{display:block;font-weight:400;font-size:.76rem}
.mod-p{font-size:.78rem;color:var(--muted)}
.steps{list-style:none;margin:2px 0 10px 23px;padding:0 0 0 14px;border-left:2px solid var(--line)}
.steps button{width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:5px;font-size:.86rem;color:var(--ink-2);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.steps button:hover{background:var(--surface)}
.steps button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--lucuma)}
.steps .dot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-strong);transform:translateY(1px)}
.steps .dot.half{background:linear-gradient(90deg,var(--lucuma) 50%,transparent 50%);border-color:var(--lucuma)}
.steps .dot.done{background:var(--ok);border-color:var(--ok)}
.rail-foot{font-size:.78rem;color:var(--muted);padding:10px;border-top:1px solid var(--line);margin-top:8px}
.linkbtn{border:0;background:none;padding:0;color:var(--bad);text-decoration:underline;cursor:pointer;font-size:inherit}

main{min-width:0}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:30px 36px 34px}
.kicker{font-size:.84rem;color:var(--muted);margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kicker .sub{background:var(--ink);color:var(--bg);font-weight:700;border-radius:3px;padding:1px 7px;font-size:.74rem}
.screen h1{font-size:clamp(1.55rem,2.6vw,2.2rem);margin-bottom:6px;max-width:32ch}
.lead{font-size:1.06rem;color:var(--ink-2);margin-bottom:18px}
.stack{display:flex;flex-direction:column;gap:26px;margin-top:22px}

/* ---------- Bloques Concepto / Ejemplo / Intenta tú ---------- */
.blk{position:relative;border:1px solid var(--line);border-radius:6px;padding:26px 22px 20px;background:var(--surface)}
.blk>.tab{position:absolute;top:-12px;left:16px;font-size:.74rem;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:4px}
.blk.concept{background:var(--concept-bg);border-color:transparent}
.blk.concept>.tab{background:var(--concept);color:var(--surface)}
.blk.example{background:var(--example-bg);border-color:transparent}
.blk.example>.tab{background:var(--cyan);color:#000}
.blk.try{border:2px solid var(--ink)}
.blk.try>.tab{background:var(--lucuma);color:#000}
.blk.try.solved{border-color:var(--ok)}
.blk.try.solved>.tab::after{content:" · resuelto"}
.blk h3{font-size:1.1rem;margin-bottom:8px}
.blk ul,.blk ol{margin:.2em 0 .8em;padding-left:1.3em;max-width:70ch}
.blk li{margin:.25em 0}
.keyidea{margin-top:10px;padding:10px 14px;background:var(--surface);border-radius:5px;border:1px dashed var(--concept);max-width:72ch}
.keyidea b{color:var(--concept)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* ---------- Código estilo VS 2022 ---------- */
.code{background:var(--code-bg);color:var(--code-ink);font:14px/1.6 var(--f-code);padding:14px 16px;border-radius:6px;overflow-x:auto;white-space:pre;margin:10px 0;tab-size:4}
:root.proj .code{font-size:16px}
.code .kw{color:var(--code-kw)} .code .fn{color:var(--code-fn)} .code .st{color:var(--code-str)}
.code .nm{color:var(--code-num)} .code .cm{color:var(--code-cm)} .code .pa{color:var(--code-par)}
.code input.blank{font:inherit;background:#2D2D30;color:#FFE08A;border:0;border-bottom:2px solid var(--lucuma);padding:0 4px;min-width:5ch;border-radius:2px}
.code input.blank:focus{outline:2px solid var(--lucuma);outline-offset:1px}
.code input.blank.ok{border-bottom-color:#4EC98A;color:#9FF0C4}
.code input.blank.bad{border-bottom-color:#FF6B86;color:#FFB3C1}

/* ---------- Tablas de resultado ---------- */
.tw{overflow-x:auto;margin:8px 0}
table.rs{border-collapse:collapse;font-size:.9rem;min-width:100%}
table.rs th,table.rs td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.rs th{font-size:.78rem;color:var(--muted);font-weight:700;border-bottom:2px solid var(--ink)}
table.rs td.n,table.rs th.n{text-align:right;font-variant-numeric:tabular-nums}
.null{font-family:var(--f-code);font-size:.8em;background:var(--info-bg);color:var(--muted);padding:1px 6px;border-radius:3px}
tr.sub td{background:var(--try-bg)} tr.tot td{background:var(--ink);color:var(--bg);font-weight:700}
tr.tot .null{background:#333;color:#ddd}
tr.hl td{box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--magenta) 14%,transparent)}
.lbl{font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:3px;background:var(--info-bg)}

/* ---------- Actividades ---------- */
.q{font-weight:600;margin-bottom:10px;max-width:72ch}
.opts{display:grid;gap:8px;max-width:760px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:9px 12px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .mk{flex:none;width:18px;height:18px;border:2px solid var(--line-strong);border-radius:50%;margin-top:2px}
.opt.multi .mk{border-radius:4px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--try-bg)}
.opt[aria-pressed="true"] .mk{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.grid-m{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px 14px;align-items:center;max-width:820px}
.grid-m .it{padding:7px 10px;background:var(--surface-2);border-radius:5px;font-size:.93rem}
select,input.f,textarea{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
select.ok,input.f.ok,textarea.ok{border-color:var(--ok);background:var(--ok-bg)}
select.bad,input.f.bad,textarea.bad{border-color:var(--bad);background:var(--bad-bg)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;max-width:860px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink-2)}
.fields.wide{grid-template-columns:1fr}
textarea{min-height:88px;resize:vertical}
.ord{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-width:640px}
.ord li{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line-strong);border-radius:6px;padding:6px 8px;background:var(--surface)}
.ord li.ok{border-color:var(--ok);background:var(--ok-bg)} .ord li.bad{border-color:var(--bad);background:var(--bad-bg)}
.ord .pos{font-weight:700;width:1.6em;text-align:center}
.ord .t{flex:1}
.mini{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:1px 8px;cursor:pointer;line-height:1.4}
.mini:disabled{opacity:.35;cursor:default}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:.92rem}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--lucuma);border-color:var(--lucuma);color:#000}
.btn.pri:hover{filter:brightness(.95)}
.btn.ghost{border-color:var(--line-strong)}
.btn:disabled{opacity:.45;cursor:default}
.fb{margin-top:12px;padding:10px 14px;border-radius:6px;max-width:78ch;font-size:.95rem}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb ul{margin:.3em 0 0;padding-left:1.2em;color:var(--ink)}
.fb .ttl{font-weight:700}
.hint{margin-top:10px;padding:10px 14px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);max-width:78ch}
.hint .h{display:block;font-size:.76rem;font-weight:700;color:var(--concept);margin-bottom:2px}
.exp{margin-top:10px;padding:12px 14px;border-radius:6px;background:var(--concept-bg);max-width:78ch}
.sol{margin-top:10px;padding:12px 14px;border-radius:6px;border:2px dashed var(--line-strong);max-width:80ch}
.sol .h,.exp .h{display:block;font-size:.76rem;font-weight:700;margin-bottom:4px}
.confirm{margin-top:10px;padding:10px 14px;background:var(--try-bg);border-radius:6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- Diagramas ---------- */
figure{margin:6px 0}
figure svg{display:block;width:100%;height:auto;max-width:100%}
figcaption{font-size:.84rem;color:var(--muted);margin-top:6px;max-width:72ch}
.fig-wrap{overflow-x:auto}
.svgt{font-family:var(--f-ui);fill:currentColor}

/* ---------- Números ancla ---------- */
.anchors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--negro);color:#fff;border-radius:8px;overflow:hidden;max-width:720px}
.anchors div{padding:14px 10px;text-align:center}
.anchors div+div{border-left:1px solid #333}
.anchors strong{display:block;font-family:var(--f-disp);font-size:clamp(1.5rem,3.4vw,2.3rem);line-height:1;color:var(--lucuma);font-variant-numeric:tabular-nums}
.anchors span{font-size:.8rem;color:#ccc}
.anchors.etl strong{color:#fff}

/* ---------- Tabla dinámica simulada ---------- */
.pv{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}
.pv-panel{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:.88rem;display:flex;flex-direction:column;gap:12px}
.pv-panel h4{margin:0 0 4px;font-size:.78rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-strong);border-radius:99px;padding:2px 10px;font-size:.84rem;background:var(--surface);cursor:pointer;margin:2px 4px 2px 0}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pv-grid{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.pt{border-collapse:collapse;width:100%;font-size:.9rem}
table.pt th,table.pt td{padding:6px 10px;border:1px solid var(--line);white-space:nowrap}
table.pt thead th{background:var(--ink);color:var(--bg);font-size:.8rem;text-align:right}
table.pt thead th:first-child{text-align:left}
table.pt td{text-align:right;font-variant-numeric:tabular-nums}
table.pt td:first-child{text-align:left;font-weight:600}
table.pt td small{display:block;color:var(--muted);font-size:.78rem}
table.pt tr.child td:first-child{padding-left:30px;font-weight:400}
table.pt tr.grand td{background:var(--try-bg);font-weight:700}
.tg{border:1.5px solid var(--line-strong);background:var(--surface);width:22px;height:22px;border-radius:4px;cursor:pointer;font-weight:700;line-height:1;margin-right:6px;padding:0;color:var(--ink)}
thead .tg{background:#222;color:#fff;border-color:#666}
.oplog{margin-top:10px;padding:8px 12px;background:var(--ink);color:var(--bg);border-radius:5px;font-size:.88rem;min-height:2.3em}
.oplog b{color:var(--lucuma)}
.mission{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.9rem}
.mission li{display:flex;gap:8px;align-items:baseline}
.mission li::before{content:"";flex:none;width:12px;height:12px;border:2px solid var(--line-strong);border-radius:3px;transform:translateY(1px)}
.mission li.done{color:var(--muted);text-decoration:line-through}
.mission li.done::before{background:var(--ok);border-color:var(--ok)}

/* ---------- Report Builder / Power BI mocks ---------- */
.app{border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.app-bar{background:var(--surface-2);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.88rem}
.app-body{padding:16px}
.rep h4{margin:0 0 10px;font-size:1.05rem}
.rep table{border-collapse:collapse;width:100%;font-size:.88rem}
.rep th{background:var(--negro);color:#fff;text-align:left;padding:6px 8px;font-size:.78rem}
.rep td{padding:6px 8px;border-bottom:1px solid var(--line)}
.rep tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.rep .ph{color:var(--muted);font-style:italic}
.dash{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
.tile{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface)}
.tile h5{margin:0 0 6px;font-size:.92rem;font-family:var(--f-disp)}
.tile.wide{grid-column:1/-1}
.kpi{font-family:var(--f-disp);font-size:2.3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:.8rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.warnflag{display:inline-block;font-size:.72rem;font-weight:700;background:var(--magenta);color:#000;border-radius:3px;padding:1px 6px}
.rolepill{display:inline-block;font-size:.76rem;font-weight:700;background:var(--morado);color:#fff;border-radius:3px;padding:1px 7px}

/* ---------- Resultados ---------- */
.medal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:760px}
.medal div{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface-2)}
.medal b{display:block;font-family:var(--f-disp);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.medal span{font-size:.8rem;color:var(--muted)}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.clist li{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:5px;background:var(--surface-2)}
.tagst{flex:none;font-size:.72rem;font-weight:700;border-radius:3px;padding:1px 7px}
.tagst.dom{background:var(--ok);color:var(--surface)} .tagst.rep{background:var(--lucuma);color:#000} .tagst.pen{background:var(--line);color:var(--ink)}
.clist .go{margin-left:auto;font-size:.8rem}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}

/* ---------- Responsive ---------- */
@media (max-width: 980px){
  .shell{grid-template-columns:1fr;gap:14px;padding-inline:14px}
  .rail{position:static;max-height:none;display:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
  .rail.open{display:block}
  .menu-btn{display:inline-block}
  .screen{padding:24px 18px 26px}
  .pv{grid-template-columns:1fr}
  .dash{grid-template-columns:1fr}
  .grid-m{grid-template-columns:1fr}
  .grid-m .it{margin-top:6px}
}
@media (max-width: 640px){
  .hdr-in{flex-wrap:wrap;gap:8px 12px;padding:8px 14px}

<script>
"use strict";
/* =======================================================================
   SIMULADOR TEMA 06 · MoviTrack · Base de Datos Avanzadas y Big Data (UPN)
   Organización del código:
     0. Utilidades
     1. Datos del caso            ← resultados esperados y datos de MoviTrack
     2. Navegación                 ← módulos y pasos (más abajo, en el motor)
     3. Componentes visuales       ← diagramas, tablas y gráficos
     4. Actividades                ← preguntas, respuestas, pistas y explicaciones
     5. Validadores                ← cómo se corrige cada tipo de actividad
     6. Pistas                     ← lógica de pistas progresivas y solución
     7. Resultados y progreso      ← avance, logros y pantalla final
   ======================================================================= */

/* =======================================================================
   0. UTILIDADES
   ======================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = n => "S/ " + Number(n).toFixed(2);
const dec = n => Number(n).toFixed(2);
const NULLC = '<span class="null">NULL</span>';
const stripAcc = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "");
/* Normaliza SQL/DAX para comparar respuestas: sin tildes, mayúsculas, sin espacios sobrantes. */
function normCode(s) {
  return stripAcc(s).replace(/[“”«»]/g, '"').replace(/[‘’]/g, "'").trim().replace(/;+$/, "")
    .replace(/\s+/g, " ").replace(/\s*([(),=\[\]<>*+\/-])\s*/g, "$1").toUpperCase();
}
/* Normaliza texto libre: minúsculas y sin tildes. */
const normTxt = s => stripAcc(s).toLowerCase().replace(/\s+/g, " ").trim();
/* Acepta 120 · 120.00 · 120,00 · S/ 120.00 · 60 % */
function parseNum(v) {
  if (v == null) return NaN;
  let s = String(v).replace(/s\/\s*/i, "").replace(/%/g, "").replace(/\s/g, "");
  if (!s) return NaN;
  if (s.includes(",") && s.includes(".")) s = s.replace(/,/g, "");
  else s = s.replace(",", ".");
  return Number(s);
}

/* Resaltado de sintaxis estilo Visual Studio 2022 (SQL, DAX, expresiones de Report Builder). */
function hl(text) {
  const KW = new Set("SELECT FROM WHERE GROUP BY ORDER AS INNER LEFT JOIN ON ROLLUP CUBE SETS CASE WHEN THEN ELSE END USE GO WITH HAVING DISTINCT EXCEPT AND OR NOT NULL DECIMAL VARCHAR NVARCHAR IS TOP".split(" "));
  const FN = new Set("COUNT SUM AVG GROUPING NULLIF SERVERPROPERTY DB_NAME CAST COUNTROWS DIVIDE CALCULATE REMOVEFILTERS ALL COUNTROWS SUM MIN MAX".split(" "));
  const re = /(--[^\n]*|\/\/[^\n]*)|('(?:[^']|'')*'|"[^"\n]*")|(\b\d+(?:\.\d+)?\b)|(@?[A-Za-z_][\w]*)|([\s\S])/g;
  let out = "", m;
  while ((m = re.exec(text))) {
    if (m[1]) out += '<span class="cm">' + esc(m[1]) + "</span>";
    else if (m[2]) out += '<span class="st">' + esc(m[2]) + "</span>";
    else if (m[3]) out += '<span class="nm">' + m[3] + "</span>";
    else if (m[4]) {
      const w = m[4], U = w.toUpperCase(), next = text.slice(re.lastIndex).match(/^\s*\(/);
      if (w[0] === "@") out += '<span class="pa">' + esc(w) + "</span>";
      else if (FN.has(U) && next) out += '<span class="fn">' + esc(w) + "</span>";
      else if (KW.has(U) && w === U) out += '<span class="kw">' + esc(w) + "</span>";
      else out += esc(w);
    } else out += esc(m[5]);
  }
  return out;
}
const CODE = t => '<pre class="code">' + hl(t) + "</pre>";

/* =======================================================================
   1. DATOS DEL CASO  (edita aquí si tu base tiene otros valores)
   -----------------------------------------------------------------------
   Los totales vienen de la guía. La guía no lista los 6 viajes uno por
   uno; "grupos" resume los viajes por mes, distrito y servicio. Es la
   única distribución compatible con todos los totales de la guía y con
   el tablero de referencia. Si tu script de recuperación tiene otros
   viajes, reemplaza estas 4 filas (puedes poner una fila por viaje).
   ======================================================================= */
const CASO = {
  anio: 2026,
  meses: { 9: "Septiembre", 10: "Octubre" },
  servicios: ["ESTANDAR", "EJECUTIVO", "ENCOMIENDA"],
  distritos: ["Comas", "Independencia", "Los Olivos"],
  grupos: [
    { mes: 9,  distrito: "Los Olivos",    servicio: "ESTANDAR",   viajes: 2, importe: 30 },
    { mes: 9,  distrito: "Comas",         servicio: "EJECUTIVO",  viajes: 2, importe: 35 },
    { mes: 10, distrito: "Comas",         servicio: "ESTANDAR",   viajes: 1, importe: 30 },
    { mes: 10, distrito: "Independencia", servicio: "ENCOMIENDA", viajes: 1, importe: 25 }
  ],
  etl: { recibidos: 10, aceptados: 6, rechazados: 4, motivos: 4 }
};
/* Suma viajes e importe de los grupos que cumplen un filtro. */
function tot(f = () => true) {
  return CASO.grupos.filter(f).reduce((a, g) => ({ v: a.v + g.viajes, i: a.i + g.importe }), { v: 0, i: 0 });
}
const TOTAL = tot();
/* Color fijo por entidad (no por posición). */
const COLOR_DIST = { "Comas": "var(--s1)", "Los Olivos": "var(--s2)", "Independencia": "var(--s3)" };
const COLOR_SERV = { "ESTANDAR": "var(--s1)", "EJECUTIVO": "var(--s2)", "ENCOMIENDA": "var(--s3)" };

/* =======================================================================
   3. COMPONENTES VISUALES
   ======================================================================= */
function anchorsHTML() {
  return `<div class="anchors" role="group" aria-label="Datos de control del laboratorio">
    <div><strong>${TOTAL.v}</strong><span>viajes</span></div>
    <div><strong>${dec(TOTAL.i)}</strong><span>importe total (S/)</span></div>
    <div><strong>${CASO.servicios.length}</strong><span>servicios</span></div>
    <div><strong>${CASO.distritos.length}</strong><span>ubicaciones</span></div></div>`;
}
function etlAnchorsHTML() {
  const e = CASO.etl;
  return `<div class="anchors etl" role="group" aria-label="Datos del proceso ETL">
    <div><strong>${e.recibidos}</strong><span>recibidos</span></div>
    <div><strong>${e.aceptados}</strong><span>aceptados</span></div>
    <div><strong>${e.rechazados}</strong><span>rechazados</span></div>
    <div><strong>${(100 * e.aceptados / e.recibidos).toFixed(0)} %</strong><span>aceptación</span></div></div>`;
}

/* Caja de tabla para diagramas SVG */
function svgTable(x, y, w, name, rows, head) {
  const H = 30, R = 24, h = H + rows.length * R;
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" style="fill:var(--surface);stroke:currentColor" stroke-width="1.5"/>
    <rect x="${x}" y="${y}" width="${w}" height="${H}" rx="4" style="fill:${head}"/>
    <rect x="${x}" y="${y + H - 4}" width="${w}" height="4" style="fill:${head}"/>
    <text x="${x + 10}" y="${y + 20}" font-size="13" font-weight="700" style="fill:#000">${name}</text>`;
  rows.forEach((r, i) => {
    const ry = y + H + i * R;
    if (i) s += `<line x1="${x}" y1="${ry}" x2="${x + w}" y2="${ry}" style="stroke:var(--line)"/>`;
    s += `<text class="svgt" x="${x + 10}" y="${ry + 16}" font-size="12.5"${r[1] ? ' font-weight="700"' : ""}>${r[0]}</text>`;
    if (r[2]) s += `<text x="${x + w - 8}" y="${ry + 16}" font-size="10.5" text-anchor="end" style="fill:var(--muted)">${r[2]}</text>`;
  });
  return s;
}
function starSVG() {
  return `<figure><div class="fig-wrap"><svg viewBox="0 0 770 380" role="img" aria-label="Modelo estrella: FactViajeE04 en el centro, unido a DimFechaE02 por FechaKey, a DimServicioE02 por ServicioKey y a DimUbicacionE02 por UbicacionKey, siempre una fila de la dimensión para varias filas del hecho.">
    <defs><marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:currentColor"/></marker></defs>
    ${svgTable(290, 96, 200, "FactViajeE04", [["CodigoViaje", 0, "grano: 1 viaje"], ["Origen", 0, ""], ["FechaKey", 1, "FK"], ["ServicioKey", 1, "FK"], ["UbicacionKey", 1, "FK"], ["Importe", 0, "medida"]], "var(--fact)")}
    ${svgTable(20, 156, 190, "DimFechaE02", [["FechaKey", 1, "PK"], ["Fecha", 0, ""], ["Anio", 0, ""], ["Mes", 0, ""]], "var(--dim)")}
    ${svgTable(570, 40, 180, "DimServicioE02", [["ServicioKey", 1, "PK"], ["Servicio", 0, ""]], "var(--dim)")}
    ${svgTable(570, 270, 180, "DimUbicacionE02", [["UbicacionKey", 1, "PK"], ["Distrito", 0, ""]], "var(--dim)")}
    <polyline points="210,198 290,198" fill="none" style="stroke:currentColor" stroke-width="1.8"/>
    <text class="svgt" x="218" y="192" font-size="12" font-weight="700">1</text><text class="svgt" x="274" y="192" font-size="12" font-weight="700">N</text>
    <polyline points="490,222 528,222 528,82 570,82" fill="none" style="stroke:currentColor" stroke-width="1.8"/>
    <text class="svgt" x="555" y="76" font-size="12" font-weight="700">1</text><text class="svgt" x="496" y="216" font-size="12" font-weight="700">N</text>
    <polyline points="490,246 546,246 546,312 570,312" fill="none" style="stroke:currentColor" stroke-width="1.8"/>
    <text class="svgt" x="556" y="306" font-size="12" font-weight="700">1</text><text class="svgt" x="496" y="262" font-size="12" font-weight="700">N</text>
    <text x="390" y="340" font-size="12" text-anchor="middle" style="fill:var(--muted)">Cada viaje apunta a una fecha, un servicio y un distrito.</text>
    <text x="390" y="358" font-size="12" text-anchor="middle" style="fill:var(--muted)">Una fila de cada dimensión describe a muchos viajes (1 : N).</text>
  </svg></div><figcaption>El hecho guarda las claves y la medida; las dimensiones guardan los nombres con los que se agrupa (Anio, Mes, Servicio, Distrito).</figcaption></figure>`;
}
function etlSVG() {
  const box = (x, y, w, t1, t2, fill, ink = "#000") => `<rect x="${x}" y="${y}" width="${w}" height="58" rx="5" style="fill:${fill};stroke:currentColor" stroke-width="1.2"/>
    <text x="${x + w / 2}" y="${y + 24}" text-anchor="middle" font-size="13" font-weight="700" style="fill:${ink}">${t1}</text>
    <text x="${x + w / 2}" y="${y + 43}" text-anchor="middle" font-size="12" style="fill:${ink}">${t2}</text>`;
  const e = CASO.etl;
  return `<figure><div class="fig-wrap"><svg viewBox="0 0 780 250" role="img" aria-label="Flujo ETL: StgViajeE03 recibe 10 registros; la validación envía 6 a ViajeValidoE03 y 4 a ViajeRechazadoE03; los 6 válidos se publican en FactViajeE04.">
    <defs><marker id="arE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:currentColor"/></marker></defs>
    ${box(10, 40, 150, "StgViajeE03", e.recibidos + " recibidos", "var(--surface-2)", "currentColor")}
    ${box(215, 40, 130, "Validación", "reglas de calidad", "var(--ink)", "var(--bg)")}
    ${box(400, 40, 160, "ViajeValidoE03", e.aceptados + " aceptados", "var(--cyan)")}
    ${box(615, 40, 155, "FactViajeE04", e.aceptados + " hechos publicados", "var(--lucuma)")}
    ${box(400, 170, 160, "ViajeRechazadoE03", e.rechazados + " rechazados · " + e.motivos + " motivos", "var(--magenta)")}
    <line x1="160" y1="69" x2="213" y2="69" style="stroke:currentColor" stroke-width="1.8" marker-end="url(#arE)"/>
    <line x1="345" y1="69" x2="398" y2="69" style="stroke:currentColor" stroke-width="1.8" marker-end="url(#arE)"/>
    <line x1="560" y1="69" x2="613" y2="69" style="stroke:currentColor" stroke-width="1.8" marker-end="url(#arE)"/>
    <polyline points="280,98 280,199 398,199" fill="none" style="stroke:currentColor" stroke-width="1.8" marker-end="url(#arE)"/>
    <text class="svgt" x="372" y="60" font-size="11" text-anchor="middle">cumple</text>
    <text class="svgt" x="587" y="60" font-size="11" text-anchor="middle">carga</text>
    <text class="svgt" x="288" y="150" font-size="11">no cumple</text>
    <text class="svgt" x="600" y="190" font-size="12">Tasa = 100 × ${e.aceptados} / ${e.recibidos} = ${(100 * e.aceptados / e.recibidos).toFixed(2)} %</text>
    <text class="svgt" x="600" y="210" font-size="12">Sin clasificar = ${e.recibidos} − ${e.aceptados} − ${e.rechazados} = ${e.recibidos - e.aceptados - e.rechazados}</text>
  </svg></div><figcaption>Todo registro recibido debe terminar como aceptado o rechazado. Solo los aceptados llegan al hecho que analizarás hoy.</figcaption></figure>`;
}
/* Resumen visual de los 6 viajes */
function factSummaryHTML() {
  let r = CASO.grupos.map(g => `<tr><td>${CASO.anio}</td><td>${g.mes} · ${CASO.meses[g.mes]}</td><td>${g.distrito}</td><td>${g.servicio}</td><td class="n">${g.viajes}</td><td class="n">${dec(g.importe)}</td></tr>`).join("");
  return `<div class="tw"><table class="rs"><thead><tr><th>Anio</th><th>Mes</th><th>Distrito</th><th>Servicio</th><th class="n">Viajes</th><th class="n">Importe</th></tr></thead>
  <tbody>${r}<tr class="tot"><td colspan="4">Total de FactViajeE04</td><td class="n">${TOTAL.v}</td><td class="n">${dec(TOTAL.i)}</td></tr></tbody></table></div>`;
}
function dimTablesHTML() {
  const t = (name, col, vals) => `<div><div class="tw"><table class="rs"><thead><tr><th>${name}</th></tr></thead><tbody>${vals.map(v => `<tr><td>${v}</td></tr>`).join("")}</tbody></table></div><small>${col}</small></div>`;
  return `<div class="two">${t("DimServicioE02 · Servicio", "3 filas · clave ServicioKey", CASO.servicios)}${t("DimUbicacionE02 · Distrito", "3 filas · clave UbicacionKey", CASO.distritos)}${t("DimFechaE02 · Anio / Mes", "clave FechaKey · un día por fila", ["2026 / 9 (Septiembre)", "2026 / 10 (Octubre)"])}</div>`;
}
/* Escalera de ROLLUP: qué columnas conserva cada nivel */
function rollupStairsHTML(cols, names) {
  const n = cols.length;
  let rows = "";
  for (let lvl = 0; lvl <= n; lvl++) {
    const kept = n - lvl;
    const cells = cols.map((c, i) => i < kept ? `<span class="lbl" style="background:var(--dim);color:#000">${c}</span>` : NULLC).join(" ");
    rows += `<tr${lvl === n ? ' class="tot"' : lvl ? ' class="sub"' : ""}><td><b>${lvl + 1}</b></td><td>${names[lvl]}</td><td>${cells}</td><td>${lvl ? "retira <b>" + cols[kept] + "</b>" : "conserva todo"}</td></tr>`;
  }
  return `<div class="tw"><table class="rs"><thead><tr><th>Nivel</th><th>Qué resume</th><th>Columnas en el resultado</th><th>Movimiento</th></tr></thead><tbody>${rows}</tbody></table></div>
  <figcaption>ROLLUP (${cols.join(", ")}) retira columnas de derecha a izquierda: ${cols.slice().reverse().join(" → ")} y termina en el total general.</figcaption>`;
}
/* Resultados calculados desde los datos */
function rollupAMD() {
  const rows = [];
  [9, 10].forEach(m => {
    CASO.distritos.forEach(d => { const t = tot(g => g.mes === m && g.distrito === d); if (t.v) rows.push({ c: [CASO.anio, m, d], t, k: "Detalle" }); });
    rows.push({ c: [CASO.anio, m, null], t: tot(g => g.mes === m), k: "Subtotal del mes" });
  });
  rows.push({ c: [CASO.anio, null, null], t: TOTAL, k: "Subtotal del año" });
  rows.push({ c: [null, null, null], t: TOTAL, k: "Total general" });
  return rows;
}
function cubeDS() {
  const rows = [];
  CASO.distritos.forEach(d => {
    CASO.servicios.slice().sort().forEach(s => { const t = tot(g => g.distrito === d && g.servicio === s); if (t.v) rows.push({ c: [d, s], t, only: false }); });
    rows.push({ c: [d, null], t: tot(g => g.distrito === d), only: false });
  });
  CASO.servicios.slice().sort().forEach(s => rows.push({ c: [null, s], t: tot(g => g.servicio === s), only: true }));
  rows.push({ c: [null, null], t: TOTAL, only: false });
  return rows;
}
function resultTable(heads, rows, opt = {}) {
  const body = rows.map(r => {
    const allNull = r.c.every(x => x == null), anyNull = r.c.some(x => x == null);
    const cls = allNull ? "tot" : anyNull ? "sub" : "";
    const hlc = opt.hl && opt.hl(r) ? " hl" : "";
    return `<tr class="${cls}${hlc}">${r.c.map(x => `<td>${x == null ? NULLC : x}</td>`).join("")}${opt.vals.map(f => `<td class="n">${f(r)}</td>`).join("")}</tr>`;
  }).join("");
  return `<div class="tw"><table class="rs"><thead><tr>${heads.map((h, i) => `<th${i >= r0(heads, opt) ? ' class="n"' : ""}>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function r0(heads, opt) { return heads.length - opt.vals.length; }

/* Operaciones OLAP: mini diagramas */
function olapFlowHTML() {
  const card = (t, d, svg) => `<div class="blk" style="padding:14px"><h3 style="font-size:1rem">${t}</h3>${svg}<p style="font-size:.88rem;margin:6px 0 0">${d}</p></div>`;
  const cell = (x, y, on) => `<rect x="${x}" y="${y}" width="22" height="16" rx="2" style="fill:${on ? "var(--lucuma)" : "var(--surface-2)"};stroke:currentColor" stroke-width="1"/>`;
  const grid = pred => { let s = ""; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) s += cell(40 + c * 26, 8 + r * 20, pred(r, c)); return s; };
  const sv = inner => `<svg viewBox="0 0 170 72" role="img" style="max-width:220px">${inner}</svg>`;
  return `<div class="two">
   ${card("Drill-down", "Bajas de un nivel resumido a uno más detallado: de 2026 a septiembre y octubre.", sv(`<rect x="50" y="4" width="70" height="20" rx="3" style="fill:var(--lucuma)"/><text x="85" y="18" text-anchor="middle" font-size="11" style="fill:#000">2026</text><line x1="85" y1="24" x2="85" y2="40" style="stroke:currentColor" stroke-width="1.6"/><path d="M80 36L85 44L90 36z" style="fill:currentColor"/><rect x="18" y="46" width="62" height="20" rx="3" style="fill:var(--surface-2);stroke:currentColor"/><rect x="90" y="46" width="62" height="20" rx="3" style="fill:var(--surface-2);stroke:currentColor"/><text class="svgt" x="49" y="60" text-anchor="middle" font-size="10">Sep</text><text class="svgt" x="121" y="60" text-anchor="middle" font-size="10">Oct</text>`))}
   ${card("Roll-up", "Subes al nivel resumido: los meses se contraen en el total del año.", sv(`<rect x="18" y="46" width="62" height="20" rx="3" style="fill:var(--surface-2);stroke:currentColor"/><rect x="90" y="46" width="62" height="20" rx="3" style="fill:var(--surface-2);stroke:currentColor"/><text class="svgt" x="49" y="60" text-anchor="middle" font-size="10">Sep</text><text class="svgt" x="121" y="60" text-anchor="middle" font-size="10">Oct</text><line x1="85" y1="44" x2="85" y2="30" style="stroke:currentColor" stroke-width="1.6"/><path d="M80 32L85 24L90 32z" style="fill:currentColor"/><rect x="50" y="4" width="70" height="20" rx="3" style="fill:var(--lucuma)"/><text x="85" y="18" text-anchor="middle" font-size="11" style="fill:#000">2026</text>`))}
   ${card("Slice", "Fijas una dimensión en un solo valor: por ejemplo, solo el servicio ESTANDAR.", sv(grid((r) => r === 1)))}
   ${card("Dice", "Restringes dos o más dimensiones a la vez: un servicio y dos distritos.", sv(grid((r, c) => r < 2 && c < 2)))}
   ${card("Pivot", "Intercambias filas y columnas. Cambia la orientación; los totales no cambian.", sv(`<rect x="20" y="10" width="54" height="18" rx="3" style="fill:var(--dim)"/><text x="47" y="23" text-anchor="middle" font-size="10" style="fill:#000">Filas</text><rect x="96" y="10" width="54" height="18" rx="3" style="fill:var(--lucuma)"/><text x="123" y="23" text-anchor="middle" font-size="10" style="fill:#000">Columnas</text><path d="M47 34 C47 60,123 60,123 36" fill="none" style="stroke:currentColor" stroke-width="1.5"/><path d="M118 40L123 32L128 40z" style="fill:currentColor"/><path d="M123 34 C123 8,47 8,47 30" fill="none" style="stroke:currentColor;opacity:.0"/>`))}
  </div>`;

function rlsSVG() {

/* Gráfico de columnas agrupadas: viajes por mes y distrito */
function colsChart(filterFn) {
  const meses = [9, 10], W = 520, H = 220, x0 = 40, y0 = 180, maxV = 3;
  const dists = CASO.distritos.filter(d => tot(g => g.distrito === d && filterFn(g)).v > 0 || false);
  const shown = dists.length ? dists : [];
  let s = "";
  for (let v = 0; v <= maxV; v++) { const y = y0 - v * 50; s += `<line x1="${x0}" y1="${y}" x2="${W - 10}" y2="${y}" style="stroke:var(--line)"/><text x="${x0 - 8}" y="${y + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${v}</text>`; }
  const gw = (W - x0 - 20) / meses.length;
  meses.forEach((m, mi) => {
    const present = shown.filter(d => tot(g => g.mes === m && g.distrito === d && filterFn(g)).v > 0);
    const bw = 44, gap = 2, totalW = present.length * bw + (present.length - 1) * gap;
    const cx = x0 + gw * mi + gw / 2;
    present.forEach((d, di) => {
      const t = tot(g => g.mes === m && g.distrito === d && filterFn(g));
      const h = t.v * 50, x = cx - totalW / 2 + di * (bw + gap);
      s += `<path d="M${x} ${y0}V${y0 - h + 4}q0 -4 4 -4h${bw - 8}q4 0 4 4V${y0}z" style="fill:${COLOR_DIST[d]}"><title>${d} · ${CASO.meses[m]}: ${t.v} viaje(s), ${money(t.i)}</title></path>
        <text x="${x + bw / 2}" y="${y0 - h - 6}" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--ink)">${t.v}</text>`;
    });
    s += `<text x="${cx}" y="${y0 + 18}" text-anchor="middle" font-size="12" style="fill:var(--ink-2)">${CASO.meses[m]} ${CASO.anio}</text>`;
  });
  s += `<line x1="${x0}" y1="${y0}" x2="${W - 10}" y2="${y0}" style="stroke:var(--ink-2)"/>`;
  const leg = shown.map(d => `<span><i style="background:${COLOR_DIST[d]}"></i>${d}</span>`).join("");
  return `<svg viewBox="0 0 ${W} ${H - 10}" style="max-width:620px" role="img" aria-label="Viajes por distrito y mes">${s}</svg><div class="legend">${leg || "Sin datos visibles"}</div>`;
}
/* Barras horizontales de participación */
function partBars(vals) {
  const W = 520, x0 = 110, maxP = 100;
  let s = "";
  vals.forEach((v, i) => {
    const y = 10 + i * 36, w = Math.max(2, (W - x0 - 70) * v.p / maxP);
    s += `<text x="${x0 - 8}" y="${y + 17}" text-anchor="end" font-size="12" style="fill:var(--ink-2)">${v.s}</text>
      <path d="M${x0} ${y}h${w - 4}q4 0 4 4v16q0 4 -4 4h${-(w - 4)}z" style="fill:${COLOR_SERV[v.s]}"><title>${v.s}: ${v.p.toFixed(2)} %</title></path>
      <text x="${x0 + w + 8}" y="${y + 17}" font-size="12" font-weight="700" style="fill:var(--ink)">${v.p.toFixed(2)} %</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${vals.length * 36 + 14}" style="max-width:560px" role="img" aria-label="Participación por servicio">${s}</svg>`;
}

<script>
"use strict";
/* =======================================================================
   7a. ESTADO Y PROGRESO (se guarda en este navegador, si está permitido)
   ======================================================================= */
const KEY = "upn-t06-simulador-v1";
let S = { scr: "p1", a: {}, notes: {}, ev: {}, sim: {}, theme: null, proj: false };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) { /* sin almacenamiento */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function A(id) { return S.a[id] || (S.a[id] = { tries: 0, hints: 0, solved: false, first: false, sol: false, exp: false, val: {} }); }

/* Índices */
const SCR_IDX = {}; SCREENS.forEach((s, i) => SCR_IDX[s.id] = i);
const ACT_SCR = {};
SCREENS.forEach(s => s.blocks.forEach(b => { if (b.k === "a") { ACT_SCR[b.id] = s.id; if (b.pre && !ACT[b.id].sim) ACT[b.id].sim = b.pre; } }));
const ACT_IDS = Object.keys(ACT).filter(id => ACT_SCR[id]);
const stepName = s => (s.t.startsWith(s.sub) || s.t.includes(s.sub + ":")) ? s.t : s.sub + " · " + s.t;
const modOf = id => SCREENS[SCR_IDX[ACT_SCR[id]]].mod;
const EVID = {
  e1: "Evidencia E01: capturas de los Pasos 2 y 3 con sus subtotales; el SQL ejecutado de los TODO 1 y 1B; y las respuestas de los TODO 2 y 3 dentro de Ejercicio01-Tema06.sql.",
  e2: "Evidencia E02: estructura del cubo; tabla dinámica con 2026 expandido hasta los meses; archivo .rdl; y captura del reporte de Comas con 3 viajes y 65.00.",
  e3: "Evidencia E03: vista Modelo con las relaciones, las cuatro medidas creadas, el dashboard con los tres KPIs titulados, el razonamiento del TODO 3 y el archivo guardado.",
  e4: "Evidencia E04: diccionario completo; tasa de aceptación; correspondencia entre válidos y hechos; conteo de rechazos por motivo; capturas sin RLS y con Analista Comas; consulta del TODO 4 con interpretación y medida correctiva; y el .pbix actualizado."
};

function actsOf(filter) { return ACT_IDS.filter(filter); }
function pctTotal() { const n = ACT_IDS.length, d = ACT_IDS.filter(id => A(id).solved).length; return { n, d, p: Math.round(100 * d / n) }; }
function conceptStatus(c) {
  const ids = actsOf(id => ACT[id].c === c);
  const st = ids.map(A);
  if (!st.some(s => s.tries || s.solved || s.hints || s.sol)) return "pen";
  const all = st.every(s => s.solved), anySol = st.some(s => s.sol), hints = st.reduce((a, s) => a + s.hints, 0);
  return all && !anySol && hints <= ids.length ? "dom" : "rep";
}
function firstScreenOfConcept(c) {
  const ids = actsOf(id => ACT[id].c === c);
  const pending = ids.find(id => !A(id).solved || A(id).sol) || ids[0];
  return ACT_SCR[pending];
}
function modStats(mod) {
  const ids = actsOf(id => modOf(id) === mod), st = ids.map(A);
  return { n: ids.length, solved: st.filter(s => s.solved).length, first: st.filter(s => s.first).length,
    hints: st.reduce((a, s) => a + s.hints, 0), sols: st.filter(s => s.sol).length };
}

/* =======================================================================
   2. NAVEGACIÓN
   ======================================================================= */
function go(id, focus = true) {
  if (!(id in SCR_IDX)) id = SCREENS[0].id;
  S.scr = id; save();
  renderAll();
  $("#rail").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
  if (focus) { window.scrollTo({ top: 0 }); $("#main").focus({ preventScroll: true }); }
  try { history.replaceState(null, "", "#" + id); } catch (e) { }
}
function renderRail() {
  const cur = SCREENS[SCR_IDX[S.scr]];
  $("#rail").innerHTML = MODS.map(m => {
    const scr = SCREENS.filter(s => s.mod === m.id);
    const ms = modStats(m.id);
    const full = ms.n && ms.solved === ms.n;
    const isCur = cur.mod === m.id;
    let steps = "";
    if (isCur) {
      steps = `<ol class="steps">${scr.map(s => {
        const ids = s.blocks.filter(b => b.k === "a").map(b => b.id);
        const done = ids.length && ids.every(i => A(i).solved), some = ids.some(i => A(i).tries || A(i).solved);
        return `<li><button type="button" data-go="${s.id}" aria-current="${s.id === S.scr}"><span class="dot ${done ? "done" : some ? "half" : ""}"></span><span>${esc(stepName(s))}</span></button></li>`;
      }).join("")}</ol>`;
    }
    return `<div class="mod ${isCur ? "cur" : ""} ${full ? "full" : ""}"><button class="mod-btn" type="button" data-go="${scr[0].id}">
      <span class="mod-n">${m.n}</span><span class="mod-t">${m.t}<small>${m.s}</small></span><span class="mod-p">${ms.n ? ms.solved + "/" + ms.n : ""}</span></button>${steps}</div>`;
  }).join("") + `<div class="rail-foot">Tu avance se guarda en este navegador.<br><span id="resetZone"><button type="button" class="linkbtn" data-do="reset">Reiniciar avance</button></span></div>`;
}
function updateHeader() {
  const cur = SCREENS[SCR_IDX[S.scr]], mod = MODS.find(m => m.id === cur.mod);
  const inMod = SCREENS.filter(s => s.mod === cur.mod), pos = inMod.indexOf(cur) + 1;
  $("#whereT").innerHTML = `<b>${esc(mod.t)}</b> · paso ${pos} de ${inMod.length} · ${esc(stepName(cur))}`;
  const p = pctTotal();
  $("#barFill").style.width = p.p + "%"; $("#pctTxt").textContent = p.p + " %";
  $("#barWrap").setAttribute("aria-valuenow", p.p);
  document.title = "Simulador OLAP MoviTrack";
}
function pagerHTML() {
  const i = SCR_IDX[S.scr], prev = SCREENS[i - 1], next = SCREENS[i + 1];
  return `<nav class="pager" aria-label="Pasos">${prev ? `<button class="btn" type="button" data-go="${prev.id}">← ${esc(stepName(prev))}</button>` : "<span></span>"}
    ${next ? `<button class="btn pri" type="button" data-go="${next.id}">${esc(stepName(next))} →</button>` : "<span></span>"}</nav>`;
}
function renderMain() {
  const s = SCREENS[SCR_IDX[S.scr]], mod = MODS.find(m => m.id === s.mod);
  let h = `<article class="screen"><div class="kicker"><span class="sub">${esc(mod.t)}</span><span>${esc(s.sub)}</span></div><h1>${esc(s.t)}</h1>${s.lead ? `<p class="lead">${s.lead}</p>` : ""}<div class="stack">`;
  s.blocks.forEach(b => {
    if (b.k === "c") h += `<section class="blk concept"><span class="tab">Concepto</span>${b.h ? `<h3>${b.h}</h3>` : ""}${b.html}</section>`;
    else if (b.k === "e") h += `<section class="blk example"><span class="tab">Ejemplo</span>${b.h ? `<h3>${b.h}</h3>` : ""}${b.html}</section>`;
    else if (b.k === "a") h += actHTML(b.id);
    else if (b.k === "logros") h += logrosHTML(b.mod);
    else if (b.k === "final") h += finalHTML();
  });
  h += `</div>${pagerHTML()}</article>`;
  $("#main").innerHTML = h;
  $$(".simbox").forEach(el => SIMS[el.dataset.sim] && SIMS[el.dataset.sim](el));
  if ($("#cmpOut")) renderCmp(S.sim.cmp || "cube");
}
function renderAll() { renderRail(); renderMain(); updateHeader(); }

/* =======================================================================
   4b. RENDER DE ACTIVIDADES
   ======================================================================= */
function actHTML(id) {
  const d = ACT[id], st = A(id);
  let body = "";
  const v = st.val;
  if (d.sim && d.type !== "mission") body += `<div class="simbox" data-sim="${d.sim}" data-act="${id}" style="margin-bottom:14px"></div>`;
  switch (d.type) {
    case "choice": case "multi":
      body += `<div class="opts" role="${d.type === "choice" ? "radiogroup" : "group"}">${d.opts.map((o, i) => {
        const on = d.type === "choice" ? v.pick === i : (v.picks || []).includes(i);
        return `<button type="button" class="opt ${d.type === "multi" ? "multi" : ""}" data-act="${id}" data-opt="${i}" aria-pressed="${on}"><span class="mk"></span><span>${esc(o.t)}</span></button>`;
      }).join("")}</div>`; break;
    case "match":

/* =======================================================================
   5. VALIDADORES  (cada tipo devuelve { ok, msgs, notes })
   ======================================================================= */
function numOk(val, f) { const n = parseNum(val); return !isNaN(n) && Math.abs(n - f.v) <= (f.tol ?? 0.005); }
const V = {
  choice(d, st) {
    if (st.val.pick == null) return { ok: false, msgs: ["Elige una opción."] };
    const o = d.opts[st.val.pick]; return { ok: !!o.ok, msgs: [o.fb || ""], mark: { [st.val.pick]: o.ok ? "ok" : "bad" } };
  },
  multi(d, st) {
    const p = st.val.picks || [];
    if (!p.length) return { ok: false, msgs: ["Marca al menos una opción."] };
    const msgs = [], mark = {};
    p.forEach(i => { mark[i] = d.opts[i].ok ? "ok" : "bad"; if (!d.opts[i].ok) msgs.push(d.opts[i].fb || `«${d.opts[i].t}» no corresponde.`); });
    const miss = d.opts.filter((o, i) => o.ok && !p.includes(i)).length;
    if (miss) msgs.push(`Te falta marcar ${miss} opción${miss > 1 ? "es" : ""} correcta${miss > 1 ? "s" : ""}.`);
    return { ok: !msgs.length, msgs, mark };
  },
  match(d, st) {
    const msgs = [], mark = {};
    d.items.forEach((it, i) => {
      const val = st.val["m" + i];
      if (!val) { msgs.push(`Falta relacionar «${it.l}».`); return; }
      const ok = val === it.a; mark["m" + i] = ok ? "ok" : "bad";
      if (!ok) msgs.push(it.fb ? `«${it.l}»: ${it.fb}` : `«${it.l}» no va con «${val}».`);
    });
    return { ok: !msgs.length, msgs, mark };
  },
  tablesel(d, st) {
    const t = d._t || d.build(), msgs = [], mark = {};
    let empty = 0;
    t.rows.forEach((r, i) => t.asks.forEach((a, j) => {
      const k = "r" + i + "c" + j, val = st.val[k];
      if (!val) { empty++; return; }
      const ok = val === t.ans[i][j]; mark[k] = ok ? "ok" : "bad";
      if (!ok) msgs.push(`Fila ${i + 1} (${String(r[0]).replace(/<[^>]+>/g, "")} · ${String(r[1] ?? "").replace(/<[^>]+>/g, "")}): revisa «${a.h}».`);
    }));
    if (empty) msgs.unshift(`Te faltan ${empty} casilla${empty > 1 ? "s" : ""} por completar.`);
    return { ok: !msgs.length, msgs: msgs.slice(0, 5), mark };
  },
  fill(d, st) {
    const msgs = [], notes = [], mark = {}, keys = Object.keys(d.blanks);
    keys.forEach((k, idx) => {
      const b = d.blanks[k], raw = st.val[k] || "", n = normCode(raw), lab = `Espacio ${idx + 1}`;
      if (!raw.trim()) { msgs.push(`${lab}: está vacío.`); mark[k] = "bad"; return; }
      if (b.any) { const ok = /^[A-Za-z_][\w.]*$/.test(raw.trim()); mark[k] = ok ? "ok" : "bad"; if (!ok) msgs.push(`${lab}: escribe solo el nombre de una columna.`); return; }
      if (b.same) { const ok = n === normCode(st.val[b.same] || "") && n; mark[k] = ok ? "ok" : "bad"; if (!ok) msgs.push(`${lab}: ${b.sameMsg}`); return; }
      if (b.acc.includes(n)) { mark[k] = "ok"; return; }
      const soft = (b.soft || []).find(([re]) => re.test(n));
      if (soft) { mark[k] = "ok"; notes.push(`${lab}: ${soft[1]}`); return; }
      mark[k] = "bad";
      const w = (b.wrong || []).find(([re]) => re.test(n));
      msgs.push(`${lab}: ${w ? w[1] : "no es lo que pide el comentario o la instrucción."}`);

  },
  fields(d, st) {
    const msgs = [], notes = [], mark = {};
    d.fields.forEach(f => {
      const raw = st.val[f.k] || "";
      if (!String(raw).trim()) { msgs.push(`«${f.l}»: falta completar.`); mark[f.k] = "bad"; return; }
      let ok = false, extra = "";
      if (f.kind === "num") {
        ok = numOk(raw, f);
        if (!ok) { const n = parseNum(raw); extra = isNaN(n) ? "escribe solo un número." : (f.fb || "no coincide con el resultado esperado. Revisa el cálculo."); }
      } else if (f.kind === "select") { ok = f.ans.includes(raw); if (!ok) extra = f.fb || "no es la opción correcta."; }
      else {

        if (!ok) { const w = (f.wrong || []).find(([re]) => re.test(n)); extra = w ? w[1] : (f.fb || "no coincide."); }

  },
  order(d, st) {
    const o = st.val.order, mark = {}, msgs = [];

  text(d, st) {

  },
  dict(d, st) {

      [s => has(s, ["importe", "fact"]) && has(s, ["servicio"]), s => has(s, ["removefilters", "all(", "calculate", "participacion"]), "La participación usa el importe y la dimensión de servicio."]

      if (!okC) msgs.push(`${r} · Criterio: debe poder verificarse con un número (conteo, porcentaje o valor esperado).`);

  }
};

function applyMarks(id, res) {

  if (el.dataset.pv === "serv") { const p = pvState(); p.serv = el.value; afterFilter(p); save(); SIMS.pivot($('.simbox[data-sim="pivot"]')); $("#pvServ")?.focus(); return; }
  if (el.dataset.rep === "d") { S.sim.rep.d = el.value; S.sim.rep.shown = false; save(); SIMS.report($('.simbox[data-sim="report"]')); $("#repD")?.focus(); return; }
  if (el.dataset.priv === "k") { S.sim.k = +el.value; save(); SIMS.priv($('.simbox[data-sim="priv"]')); $("#privK")?.focus(); return; }
}
document.addEventListener("input", onInput);
document.addEventListener("change", ev => { if (ev.target.tagName === "SELECT" || ev.target.type === "checkbox") onInput(ev); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.matches("input.blank, input.f")) { ev.preventDefault(); validate(ev.target.dataset.act); }
});

/* Tema y modo proyector */
function applyPrefs() {
  const r = document.documentElement;
  if (S.theme) r.setAttribute("data-theme", S.theme);
  r.classList.toggle("proj", !!S.proj);
  $("#projBtn").setAttribute("aria-pressed", !!S.proj);
  const dark = isDark();
  $("#themeBtn").textContent = dark ? "Tema claro" : "Tema oscuro";
}
function isDark() {
  const t = S.theme || document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
$("#themeBtn").addEventListener("click", () => {
  const dark = isDark();
  S.theme = dark ? "light" : "dark"; save(); applyPrefs();
});
$("#projBtn").addEventListener("click", () => { S.proj = !S.proj; save(); applyPrefs(); });
$("#menuBtn").addEventListener("click", () => { const o = $("#rail").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); });

/* Inicio */
applyPrefs();
const hash = (location.hash || "").slice(1);
go(hash in SCR_IDX ? hash : S.scr, false);
</script>
