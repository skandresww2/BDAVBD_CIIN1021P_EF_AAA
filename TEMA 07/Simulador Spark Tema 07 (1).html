<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Simulador Spark Tema 07</title>
<style>
/* =====================================================================
   COLORES Y TEXTOS BASE (el docente puede cambiar estos valores)
   Diseño de un solo tema claro, pensado para proyectar.
   Acento UPN: #FDBA30 (siempre con texto negro encima).
   ===================================================================== */
:root{
  color-scheme:light;
  --upn:#FDBA30; --upn-soft:#FFF4D6; --upn-line:#E7A300;
  --bg:#F3F3F0; --surface:#FFFFFF; --surface-2:#F8F8F5; --ink:#141414; --ink-2:#3B3B38;
  --muted:#5F5F5A; --line:#DCDBD4; --line-strong:#ADABA2;
  --concept:#6A1FB8; --concept-bg:#F4EEFC;
  --info:#0A5F99; --info-bg:#E7F3FB;
  --ok:#0B7A41; --ok-bg:#E2F3E9; --bad:#B8143A; --bad-bg:#FCE7EB; --warn-bg:#FFF4D6;
  --code-bg:#1E1E1E; --code-ink:#D4D4D4; --code-kw:#569CD6; --code-fn:#DCDCAA; --code-str:#CE9178;
  --code-num:#B5CEA8; --code-cm:#6A9955; --code-par:#9CDCFE;
  /* Series validadas para daltonismo (fondo claro) */
  --s-norte:#0090D6; --s-centro:#C98A00; --s-sur:#9500FF;
  --p0:#0090D6; --p1:#C98A00;
  --f:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;
  --f-code:Consolas,"Cascadia Mono","SF Mono",Menlo,"Liberation Mono",monospace;
  --fs:16px;
}
:root.proj{--fs:20px}
*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--f);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
h1,h2,h3,h4{line-height:1.2;margin:0;text-wrap:balance}
p{margin:0 0 .7em;max-width:72ch}
code{font-family:var(--f-code);font-size:.9em;background:#EEEDE7;padding:.05em .35em;border-radius:3px}
small{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Cabecera ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#141414;color:#fff;border-bottom:5px solid var(--upn)}
.hdr-in{display:flex;align-items:center;gap:16px;padding:9px 20px;max-width:1500px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:1.02rem}
.brand b span{color:var(--upn)}
.brand small{color:#BDBDB6;font-size:.76rem}
.where{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.where-t{font-size:.84rem;color:#C9C9C2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-t b{color:#fff}
.bar{height:7px;background:#333;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--upn);transition:width .35s ease}
.pct{font-weight:700;font-size:.9rem;min-width:3.4em;text-align:right}
.hbtn{border:1.5px solid #666;background:transparent;color:#fff;border-radius:6px;padding:5px 10px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.hbtn[aria-pressed="true"]{background:var(--upn);border-color:var(--upn);color:#000;font-weight:700}
.menu-btn{display:none}

/* ---------- Estructura ---------- */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:26px;max-width:1500px;margin:0 auto;padding-block:20px 80px;padding-inline:20px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.sess{font-size:.74rem;font-weight:700;color:var(--muted);margin:14px 10px 4px;letter-spacing:.04em}
.sess:first-child{margin-top:0}
.mod-btn{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.mod-btn:hover{background:var(--surface)}
.mod-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.78rem;border:2px solid var(--ink)}
.mod.cur .mod-n{background:var(--upn);border-color:var(--upn-line);color:#000}
.mod.full .mod-n{background:var(--ink);color:#fff}
.mod-t{font-weight:700;font-size:.93rem;line-height:1.2}
.mod-t small{display:block;font-weight:400;font-size:.75rem}
.mod-p{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:2px 0 8px 24px;padding:0 0 0 14px;border-left:2px solid var(--line)}
.steps button{width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:5px;font-size:.85rem;color:var(--ink-2);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.steps button:hover{background:var(--surface)}
.steps button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--upn-line)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-strong);transform:translateY(1px)}
.dot.half{background:var(--upn);border-color:var(--upn-line)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.rail-foot{font-size:.78rem;color:var(--muted);padding:10px;border-top:1px solid var(--line);margin-top:10px}
.linkbtn{border:0;background:none;padding:0;color:var(--bad);text-decoration:underline;cursor:pointer;font-size:inherit}

main{min-width:0}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 34px 32px}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.pill{font-weight:700;border-radius:3px;padding:1px 8px;font-size:.74rem}
.pill.dark{background:var(--ink);color:#fff}
.pill.time{background:var(--upn);color:#000}
.pill.doc{background:var(--concept);color:#fff}
.screen h1{font-size:clamp(1.5rem,2.5vw,2.1rem);margin-bottom:6px;max-width:34ch}
.lead{font-size:1.05rem;color:var(--ink-2);margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:22px;margin-top:20px}

/* ---------- Secuencia didáctica ---------- */
.blk{position:relative;border:1px solid var(--line);border-radius:6px;padding:16px 20px 18px;background:var(--surface)}
.blk>header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.blk>header .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.76rem;font-weight:700;flex:none;background:var(--ink);color:#fff}
.blk>header .lab{font-size:.76rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.blk>header h3{font-size:1.08rem;margin:0}
.blk.sit{background:var(--surface-2)}
.blk.con{background:var(--concept-bg);border-color:transparent}
.blk.con>header .n{background:var(--concept)}
.blk.pred{border:2px solid var(--upn-line);background:var(--upn-soft)}
.blk.pred>header .n{background:var(--upn);color:#000}
.blk.int{border:2px solid var(--ink)}
.blk.res{background:var(--ok-bg);border-color:transparent}
.blk.res>header .n{background:var(--ok)}
.blk.expl{background:var(--surface-2)}
.blk.colab{background:#F1F1EC}
.blk.colab>header .n{background:#3B3B38}
.blk.doc{border:2px dashed var(--concept);background:var(--concept-bg)}
.blk.doc>header .n{background:var(--concept)}
.blk.solved{border-color:var(--ok)!important}
.blk ul,.blk ol{margin:.2em 0 .8em;padding-left:1.3em;max-width:72ch}
.blk li{margin:.25em 0}
details.more{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-weight:700;color:var(--info);font-size:.92rem}
details.more[open] summary{margin-bottom:8px}
.key{margin-top:10px;padding:10px 14px;background:var(--surface);border-left:4px solid var(--upn-line);border-radius:0 5px 5px 0;max-width:76ch}
.sim-tag{display:inline-block;font-size:.72rem;font-weight:700;border:1.5px solid var(--ink);border-radius:3px;padding:0 6px;margin-bottom:8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* ---------- Código ---------- */
.cw{margin:8px 0;border-radius:6px;overflow:hidden;background:var(--code-bg)}
.cbar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#2D2D2D;color:#CFCFCF;font-size:.78rem}
.code{color:var(--code-ink);font:14px/1.6 var(--f-code);padding:12px 16px;margin:0;overflow-x:auto;white-space:pre;tab-size:4}
:root.proj .code{font-size:17px}
.code .kw{color:var(--code-kw)} .code .fn{color:var(--code-fn)} .code .st{color:var(--code-str)}
.code .nm{color:var(--code-num)} .code .cm{color:var(--code-cm)} .code .pa{color:var(--code-par)}
.code input.blank{font:inherit;background:#333337;color:#FFE08A;border:0;border-bottom:2px solid var(--upn);padding:0 4px;min-width:4ch;border-radius:2px}
.code input.blank.ok{border-bottom-color:#4EC98A;color:#A8F0C8}
.code input.blank.bad{border-bottom-color:#FF6B86;color:#FFB3C1}
.mini{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:2px 9px;cursor:pointer;font-size:.8rem}
.cbar .mini{background:#3C3C3C;border-color:#5A5A5A;color:#fff}
.mini:disabled{opacity:.4;cursor:default}

/* ---------- Tablas ---------- */
.tw{overflow-x:auto;margin:6px 0}
table.rs{border-collapse:collapse;font-size:.9rem;min-width:100%}
table.rs th,table.rs td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.rs th{font-size:.78rem;color:var(--muted);border-bottom:2px solid var(--ink)}
table.rs .n{text-align:right;font-variant-numeric:tabular-nums}
table.rs tr.tot td{font-weight:700;background:var(--upn-soft)}
table.rs tr.hl td{background:var(--bad-bg)}
.null{font-family:var(--f-code);font-size:.8em;background:#ECEBE5;color:var(--muted);padding:1px 6px;border-radius:3px}

/* ---------- Actividades ---------- */
.q{font-weight:700;margin-bottom:10px;max-width:76ch}
.opts{display:grid;gap:8px;max-width:780px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .mk{flex:none;width:18px;height:18px;border:2px solid var(--line-strong);border-radius:50%;margin-top:2px}
.opt.multi .mk{border-radius:4px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--upn-soft)}
.opt[aria-pressed="true"] .mk{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok::after{content:"✓ correcta";margin-left:auto;font-size:.76rem;font-weight:700;color:var(--ok)}
.opt.bad::after{content:"✕ revisa";margin-left:auto;font-size:.76rem;font-weight:700;color:var(--bad)}
.grid-m{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:8px 14px;align-items:center;max-width:980px}
.grid-m .it{padding:7px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;font-size:.93rem}
select,input.f,textarea{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
select.ok,input.f.ok,textarea.ok{border-color:var(--ok);background:var(--ok-bg)}
select.bad,input.f.bad,textarea.bad{border-color:var(--bad);background:var(--bad-bg)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;max-width:880px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--ink-2)}
.fields.wide{grid-template-columns:1fr}
textarea{min-height:80px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.9rem}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--upn);border-color:var(--upn-line);color:#000}
.btn.ghost{border-color:var(--line-strong)}
.btn.docb{border-color:var(--concept);color:var(--concept)}
.btn:disabled{opacity:.45;cursor:default}
.fb{margin-top:12px;padding:10px 14px;border-radius:6px;max-width:80ch;font-size:.95rem}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb ul{margin:.3em 0 0;padding-left:1.2em;color:var(--ink)}
.fb .ttl{font-weight:700}
.hint{margin-top:10px;padding:10px 14px;border-radius:6px;background:var(--surface);border:1px solid var(--line);max-width:80ch}
.hint .h,.exp .h,.sol .h{display:block;font-size:.74rem;font-weight:700;margin-bottom:3px}
.hint .h{color:var(--info)}
.exp{margin-top:10px;padding:12px 14px;border-radius:6px;background:var(--info-bg);max-width:80ch}
.sol{margin-top:10px;padding:12px 14px;border-radius:6px;border:2px dashed var(--concept);background:var(--concept-bg);max-width:84ch}
.sol .h{color:var(--concept)}

/* ---------- Diagramas y simulaciones ---------- */
figure{margin:6px 0}
figure svg{display:block;width:100%;height:auto;max-width:100%}
figcaption{font-size:.84rem;color:var(--muted);margin-top:6px;max-width:76ch}
.fig-wrap{overflow-x:auto}
.svgt{font-family:var(--f);fill:currentColor}
.stage{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tab{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:4px 14px;cursor:pointer;font-weight:700;font-size:.86rem}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-strong);border-radius:99px;padding:3px 11px;font-size:.85rem;background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.out{font-family:var(--f-code);font-size:.88rem;background:#141414;color:#E9E9E3;border-radius:6px;padding:10px 14px;white-space:pre-wrap;min-height:2.6em}
.out b{color:var(--upn)}

/* Piezas del entorno */
.envmap{display:grid;gap:10px}
.envbox{border:2px solid var(--ink);border-radius:8px;padding:10px 12px;background:var(--surface)}
.envbox>.t{font-weight:700;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.envrow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.piece{border:1.5px solid var(--line-strong);border-radius:6px;background:var(--surface-2);padding:7px 12px;cursor:pointer;font-weight:700;font-size:.9rem;text-align:left}
.piece[aria-pressed="true"]{background:var(--upn);border-color:var(--upn-line);color:#000}
.piece small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.piece[aria-pressed="true"] small{color:#3a2a00}
.arrow-r{align-self:center;font-weight:700;color:var(--muted)}

/* Viajes y grupos (E01) */
.cards{display:flex;flex-wrap:wrap;gap:8px}
.tcard{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.86rem;min-width:118px;transition:transform .3s ease,opacity .3s ease}
.tcard b{display:block;font-size:.95rem}
.tcard.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--upn)}
.tcard.dim{opacity:.35}
.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.bucket{border:2px dashed var(--line-strong);border-radius:8px;padding:10px;min-height:150px;background:var(--surface)}
.bucket h4{font-size:.95rem;margin-bottom:6px}
.bucket .agg{font-family:var(--f-code);font-size:.85rem;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.colbtn{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--info);text-decoration:underline dotted;cursor:pointer}

/* RDD (E02) */
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.part{border:2px solid var(--p0);border-radius:8px;padding:10px;background:var(--surface)}
.part.p1{border-color:var(--p1)}
.part h4{font-size:.86rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.tup{display:inline-flex;gap:0;border:1.5px solid var(--line-strong);border-radius:6px;overflow:hidden;margin:3px;background:var(--surface);cursor:pointer;font-family:var(--f-code);font-size:.86rem;padding:0}
.tup span{padding:4px 8px}
.tup span+span{border-left:1px solid var(--line)}
.tup.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--upn)}
.tup.pass{background:var(--ok-bg);border-color:var(--ok)}
.tup.drop{opacity:.3}
.plan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:44px;padding:8px;border:2px dashed var(--line-strong);border-radius:8px;background:var(--surface)}
.node{border:1.5px dashed var(--ink);border-radius:6px;padding:4px 10px;font-family:var(--f-code);font-size:.84rem;background:var(--surface-2)}
.node.run{border-style:solid;background:var(--ok-bg);border-color:var(--ok)}
.shuffle{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:10px}
.lanes{display:grid;gap:6px}
.lane{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);font-family:var(--f-code);font-size:.84rem}

/* Calidad (E03) */
.rec{border:1.5px solid var(--line-strong);border-radius:6px;padding:8px 10px;background:var(--surface);font-family:var(--f-code);font-size:.84rem}
.reccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.reccard{border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.reccard .rec{border:0;padding:0}
.reccard.ok{border-color:var(--ok)} .reccard.bad{border-color:var(--bad)}

/* Gráficos y reporte */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.report{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.tile{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface)}
.tile h5{margin:0 0 6px;font-size:.95rem}
.tile.wide{grid-column:1/-1}
.kpi{font-size:2.3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:.8rem;color:var(--muted)}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:stretch}
.fstep{border-radius:8px;padding:10px;text-align:center;border:1.5px solid var(--line-strong);background:var(--surface)}
.fstep strong{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums}
.fstep span{font-size:.8rem;color:var(--muted)}
.fstep.y{background:var(--upn-soft);border-color:var(--upn-line)}
.fstep.g{background:var(--ok-bg);border-color:var(--ok)}
.fstep.r{background:var(--bad-bg);border-color:var(--bad)}
.timer{font-family:var(--f-code);font-size:1.6rem;font-weight:700}
.checkl{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.checkl label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checkl input{margin-top:4px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.medal{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:760px}
.medal div{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface-2)}
.medal b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.medal span{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#141414;color:#fff;padding:8px 16px;border-radius:6px;font-size:.88rem;z-index:50}

   SIMULADOR TEMA 07 · Spark en Google Colab · CIIN1021P (UPN)
   Organización:

/* =======================================================================

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dec = (n, d = 2) => Number(n).toFixed(d);
const NULLC = '<span class="null">NULL</span>';
const stripAcc = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "");
/* Normaliza código para comparar: sin espacios sobrantes, mayúsculas, comillas unificadas. */
function normCode(s) {
  return stripAcc(s).replace(/[“”«»]/g, '"').replace(/[‘’]/g, "'").replace(/'/g, '"').trim().replace(/;+$/, "")
    .replace(/\s+/g, " ").replace(/\s*([(),=\[\]<>*+\/.-])\s*/g, "$1").toUpperCase();
}
const normTxt = s => stripAcc(s).toLowerCase().replace(/\s+/g, " ").trim();
function parseNum(v) {
  if (v == null) return NaN;
  let s = String(v).replace(/%/g, "").replace(/\s/g, "");
  if (!s) return NaN;
  if (s.includes(",") && s.includes(".")) s = s.replace(/,/g, ""); else s = s.replace(",", ".");
  return Number(s);
}
/* Resaltado estilo VS Code para Python y SQL */
function hl(text, lang = "py") {
  const KW = new Set((lang === "py"
    ? "def return lambda import from as with for in if else elif not and or assert print True False None is"
    : "SELECT FROM WHERE GROUP BY ORDER AS INNER LEFT JOIN ON AND OR NOT NULL DESC ASC").split(" "));
  const FN = new Set("COUNT SUM AVG ROUND count sum collect filter map reduceByKey parallelize glom getNumPartitions toDebugString read schema csv option printSchema show createOrReplaceTempView sql agg first dropDuplicates join withColumn when otherwise col isNull isin groupBy orderBy select distinct withColumnRenamed alias stddev_samp avg round write mode parquet explain toPandas to_csv max min stddev_samp stddev avg builder appName master config getOrCreate range setLogLevel decode upload".split(" "));
  const re = lang === "py"
    ? /(#[^\n]*)|("""[\s\S]*?"""|'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w]*)|([\s\S])/g
    : /(--[^\n]*)|('(?:[^'\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w]*)|([\s\S])/g;
  let out = "", m;
  while ((m = re.exec(text))) {
    if (m[1]) out += '<span class="cm">' + esc(m[1]) + "</span>";
    else if (m[2]) out += '<span class="st">' + esc(m[2]) + "</span>";
    else if (m[3]) out += '<span class="nm">' + m[3] + "</span>";
    else if (m[4]) {
      const w = m[4], next = /^\s*\(/.test(text.slice(re.lastIndex));
      if (KW.has(w) || (lang === "sql" && KW.has(w.toUpperCase()) && w === w.toUpperCase())) out += '<span class="kw">' + esc(w) + "</span>";
      else if (FN.has(w) && next) out += '<span class="fn">' + esc(w) + "</span>";
      else out += esc(w);
    } else out += esc(m[5]);
  }
  return out;
}

/* Barras horizontales con etiqueta directa */
function hbars(rows, unit, maxV, fmt = v => dec(v, 3)) {
  const W = 560, x0 = 80, h = 30;
  let s = "";
  rows.forEach((r, i) => {
    const y = 6 + i * (h + 10), w = Math.max(2, (W - x0 - 90) * r.v / maxV);
    s += `<text x="${x0 - 8}" y="${y + 20}" text-anchor="end" font-size="13" style="fill:var(--ink-2)">${r.k}</text>
      <path d="M${x0} ${y}h${w - 4}q4 0 4 4v${h - 8}q0 4 -4 4h${-(w - 4)}z" style="fill:${r.c}"><title>${r.k}: ${fmt(r.v)} ${unit}</title></path>
      <text x="${x0 + w + 8}" y="${y + 20}" font-size="13" font-weight="700" style="fill:var(--ink)">${fmt(r.v)} ${unit}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${rows.length * (h + 10) + 8}" style="max-width:620px" role="img" aria-label="Gráfico de barras">${s}</svg>`;

e1_todo2: { c: "e1_sql", type: "fill", lang: "py",
  q: "TODO 2. Completa las tres partes de la consulta: Viajes, ImporteTotal y la columna de agrupación.",
  code: "# TODO 2. Participación de cada servicio (el indicador \"% por servicio\" del Tema 06).\n# 1. Escribe la columna Viajes: cuántos viajes hay en cada servicio.\n# 2. Escribe la columna ImporteTotal: el dinero acumulado de cada servicio.\n# 3. Escribe la columna por la que se agrupa: la que aparece en el SELECT sin función.\n# 4. La columna Porcentaje ya está resuelta: SUM(SUM(Importe)) OVER () es el total\n#    general de todos los servicios, y cada servicio se divide entre ese total.\n#    (En DAX hacías esto con DIVIDE y ALL.)\npor_servicio = spark.sql(\"\"\"\n    SELECT Servicio,\n           [[a]]     AS Viajes,\n           [[b]] AS ImporteTotal,\n           ROUND(100.0 * SUM(Importe) / SUM(SUM(Importe)) OVER (), 2) AS Porcentaje\n    FROM viajes\n    GROUP BY [[c]]\n    ORDER BY ImporteTotal DESC\n\"\"\")\npor_servicio.show()\nverificar('por_servicio', {r.Servicio: (r.Viajes, float(r.ImporteTotal), float(r.Porcentaje))\n                           for r in por_servicio.collect()})",
  blanks: {
    a: { acc: ["COUNT(*)", "COUNT(1)", "COUNT(SERVICIO)", "COUNT(CODIGOVIAJE)"], wrong: [[/^SUM|^AVG/, "Viajes cuenta filas; no suma dinero."]], w: 10 },
    b: { acc: ["SUM(IMPORTE)"], wrong: [[/^COUNT/, "ImporteTotal acumula dinero: usa la función que suma."], [/^AVG/, "AVG da el promedio; aquí se pide el acumulado."]], w: 14 },
    c: { acc: ["SERVICIO"], wrong: [[/IMPORTE|DISTRITO/, "El SELECT muestra Servicio sin función: esa es la columna de agrupación."]], w: 10 }
  },
  h: ["Viajes cuenta filas; ImporteTotal suma importes; GROUP BY lleva la columna sin función.", "COUNT(*), SUM(Importe) y la columna Servicio.", "Viajes = COUNT(*)."],
  exp: "Todo lo que aparece en el SELECT sin función de agregación debe estar en el GROUP BY.",
  sol: CODE("# TODO 2. Participación de cada servicio (el indicador \"% por servicio\" del Tema 06).\n# 1. Escribe la columna Viajes: cuántos viajes hay en cada servicio.\n# 2. Escribe la columna ImporteTotal: el dinero acumulado de cada servicio.\n# 3. Escribe la columna por la que se agrupa: la que aparece en el SELECT sin función.\n# 4. La columna Porcentaje ya está resuelta: SUM(SUM(Importe)) OVER () es el total\n#    general de todos los servicios, y cada servicio se divide entre ese total.\n#    (En DAX hacías esto con DIVIDE y ALL.)\npor_servicio = spark.sql(\"\"\"\n    SELECT Servicio,\n           COUNT(*)     AS Viajes,\n           SUM(Importe) AS ImporteTotal,\n           ROUND(100.0 * SUM(Importe) / SUM(SUM(Importe)) OVER (), 2) AS Porcentaje\n    FROM viajes\n    GROUP BY Servicio\n    ORDER BY ImporteTotal DESC\n\"\"\")\npor_servicio.show()\nverificar('por_servicio', {r.Servicio: (r.Viajes, float(r.ImporteTotal), float(r.Porcentaje))\n                           for r in por_servicio.collect()})") },

e1_todo3: { c: "e1_sql", type: "fill", lang: "py",
  q: "TODO 3. Elige las dos funciones: importe promedio por viaje y importe del viaje más caro.",
  code: "# TODO 3. Importe promedio por viaje en cada distrito, ahora con la API de DataFrames.\n# 1. groupBy('Distrito') agrupa las filas, igual que GROUP BY en SQL.\n# 2. agg(...) calcula varias métricas por grupo, separadas por coma.\n#    Primera: el importe promedio por viaje, redondeado a dos decimales.\n#    Segunda: el importe del viaje más caro de cada distrito.\n# 3. Elige las dos funciones de la Referencia rápida (F.round ya está puesto).\npromedio = (viajes.groupBy('Distrito')\n            .agg(F.round(F.[[a]]('Importe'), 2).alias('Promedio'),\n                 F.[[b]]('Importe').alias('Maximo'))\n            .orderBy('Distrito'))\npromedio.show()\nverificar('promedio', {r.Distrito: (float(r.Promedio), float(r.Maximo)) for r in promedio.collect()})",
  blanks: {
    a: { acc: ["AVG", "MEAN"], wrong: [[/^SUM/, "SUM acumula; el promedio por viaje es otra función."], [/^MAX|^MIN/, "Esa función va en la segunda posición."]], w: 8 },
    b: { acc: ["MAX"], wrong: [[/^MIN/, "min da el viaje más barato; se pide el más caro."], [/^AVG/, "avg ya se usó en la primera posición."]], w: 8 }
  },
  h: ["Consulta la fila «Calcular por grupo» de la Referencia rápida.", "El promedio es avg; el más caro es el máximo.", "avg y max."],
  exp: "groupBy + agg es la versión DataFrame de GROUP BY con varias métricas.",
  sol: CODE("# TODO 3. Importe promedio por viaje en cada distrito, ahora con la API de DataFrames.\n# 1. groupBy('Distrito') agrupa las filas, igual que GROUP BY en SQL.\n# 2. agg(...) calcula varias métricas por grupo, separadas por coma.\n#    Primera: el importe promedio por viaje, redondeado a dos decimales.\n#    Segunda: el importe del viaje más caro de cada distrito.\n# 3. Elige las dos funciones de la Referencia rápida (F.round ya está puesto).\npromedio = (viajes.groupBy('Distrito')\n            .agg(F.round(F.avg('Importe'), 2).alias('Promedio'),\n                 F.max('Importe').alias('Maximo'))\n            .orderBy('Distrito'))\npromedio.show()\nverificar('promedio', {r.Distrito: (float(r.Promedio), float(r.Maximo)) for r in promedio.collect()})") },

e3_todo2: { c: "e3_rules", type: "fill", lang: "py",
  q: "TODO 2. Escribe las dos primeras condiciones de when: peso ausente y peso no positivo.",
  code: "# TODO 2. Asignar a cada registro UN motivo de rechazo.\n# when(condición, 'motivo') se evalúa de arriba hacia abajo: gana el PRIMER motivo que se cumple.\n# 1. Primer motivo: el peso no tiene valor.\n# 2. Segundo motivo: el peso existe pero es cero o negativo.\n# 3. Los dos motivos siguientes ya están escritos; léelos para entender el patrón.\nclasificados = base.withColumn('Motivo',\n    F.when([[a]], 'Peso ausente')\n     .when([[b]], 'Peso no positivo')\n     .when(F.col('TipoResiduo').isNull() |\n           (~F.col('TipoResiduo').isin('PLASTICO', 'VIDRIO', 'ORGANICO')),\n           'Tipo no reconocido')\n     .when(F.col('JornadaValida').isNull(), 'Jornada no existente')\n     .otherwise('ACEPTADO'))\n\nvalidos = clasificados.filter(F.col('Motivo') == 'ACEPTADO')\nrechazados = clasificados.filter(F.col('Motivo') != 'ACEPTADO')\nrechazados.groupBy('Motivo').count().orderBy('Motivo').show()\n\naceptados, rechazos = validos.count(), rechazados.count()\nverificar('motivos', {r.Motivo: r['count'] for r in rechazados.groupBy('Motivo').count().collect()})\nverificar('conteos', (recibidos, duplicados, aceptados, rechazos))\ntasa = round(100 * aceptados / unicos.count(), 2)\nprint('Aceptación entre registros únicos:', tasa, '%')\nverificar('aceptacion', tasa)",
  blanks: {
    a: { acc: rxNull("PesoKg", ["BASE"]), wrong: [[/<=0|<0/, "Esa es la segunda regla; la primera detecta pesos sin valor."], [/==NONE|==NULL/, "En PySpark se usa el método isNull()."]], w: 22 },
    b: { acc: rxCmp("PesoKg", "<=", "0", ["BASE"]), wrong: [[/<0(\.0+)?$/, "Con < 0 un peso de 0 kg pasaría como válido: usa <=."], [/ISNULL/, "Esa condición ya está en la primera regla."]], w: 22 }
  },
  h: ["La primera regla detecta peso vacío; la segunda, peso cero o negativo.", "Usa F.col('PesoKg') con el método isNull() y con el operador <=.", "F.col('PesoKg').isNull()"],
  exp: "Si un peso es NULL, la comparación <= 0 no da True ni False sino NULL. Por eso la regla de nulos va primero.",
  sol: CODE("# TODO 2. Asignar a cada registro UN motivo de rechazo.\n# when(condición, 'motivo') se evalúa de arriba hacia abajo: gana el PRIMER motivo que se cumple.\n# 1. Primer motivo: el peso no tiene valor.\n# 2. Segundo motivo: el peso existe pero es cero o negativo.\n# 3. Los dos motivos siguientes ya están escritos; léelos para entender el patrón.\nclasificados = base.withColumn('Motivo',\n    F.when(F.col('PesoKg').isNull(), 'Peso ausente')\n     .when(F.col('PesoKg') <= 0, 'Peso no positivo')\n     .when(F.col('TipoResiduo').isNull() |\n           (~F.col('TipoResiduo').isin('PLASTICO', 'VIDRIO', 'ORGANICO')),\n           'Tipo no reconocido')\n     .when(F.col('JornadaValida').isNull(), 'Jornada no existente')\n     .otherwise('ACEPTADO'))\n\nvalidos = clasificados.filter(F.col('Motivo') == 'ACEPTADO')\nrechazados = clasificados.filter(F.col('Motivo') != 'ACEPTADO')\nrechazados.groupBy('Motivo').count().orderBy('Motivo').show()\n\naceptados, rechazos = validos.count(), rechazados.count()\nverificar('motivos', {r.Motivo: r['count'] for r in rechazados.groupBy('Motivo').count().collect()})\nverificar('conteos', (recibidos, duplicados, aceptados, rechazos))\ntasa = round(100 * aceptados / unicos.count(), 2)\nprint('Aceptación entre registros únicos:', tasa, '%')\nverificar('aceptacion', tasa)") },

const CODE_PASO0 = CODE("# Paso 0. Instalar la versión utilizada en esta práctica.\n%pip install -q pyspark==4.0.3") + CODE("# Paso 0. Verificar Java en la máquina de Colab.\nimport os, sys, subprocess, shutil\nfrom pathlib import Path\n\njava17 = Path('/usr/lib/jvm/java-17-openjdk-amd64')\nif not java17.exists():\n    # Esta instalación se realiza en la máquina temporal de Colab.\n    subprocess.run(['apt-get', 'update', '-qq'], check=True)\n    subprocess.run(['apt-get', 'install', '-y', '-qq',\n                    'openjdk-17-jre-headless'], check=True)\nos.environ['JAVA_HOME'] = str(java17)\nos.environ['PATH'] = str(java17 / 'bin') + os.pathsep + os.environ['PATH']\nos.environ['PYSPARK_PYTHON'] = sys.executable\nprint('Python:', sys.version.split()[0])\nprint(subprocess.check_output(['java', '-version'],\n      stderr=subprocess.STDOUT, text=True))") + CODE("# Paso 0. Iniciar Spark Classic en una sola máquina con dos hilos.\nfrom pyspark.sql import SparkSession, functions as F, types as T\nspark = (SparkSession.builder.appName('UPN_Tema07')\n         .master('local[2]')\n         .config('spark.sql.shuffle.partitions', '2')\n         .config('spark.sql.session.timeZone', 'UTC')\n         .getOrCreate())\nspark.sparkContext.setLogLevel('ERROR')\nprint('Spark:', spark.version)\nprint('Modo:', spark.sparkContext.master)\nassert spark.range(5).count() == 5\nprint('Prueba de arranque correcta')") + CODE("# Paso 0. Subir únicamente datos_tema07.zip desde tu computadora.\nfrom google.colab import files\nfrom pathlib import Path\nimport zipfile\n\nsubidos = files.upload()\nnombre = next((n for n in subidos if n.endswith('.zip')), None)\nif nombre is None:\n    raise ValueError('Sube el archivo datos_tema07.zip')\nBASE = Path('/content/datos_tema07')\nBASE.mkdir(exist_ok=True)\nesperados = {'movitrack_control.csv', 'playas.csv', 'jornadas.csv',\n             'residuos.csv', 'sensores.csv'}\nwith zipfile.ZipFile(nombre) as z:\n    assert esperados.issubset(set(z.namelist())), 'ZIP de datos incorrecto'\n    for archivo in esperados:\n        (BASE / archivo).write_bytes(z.read(archivo))\nprint('Datos disponibles:', sorted(p.name for p in BASE.glob('*.csv')))") + CODE("# Paso 0. Función de ayuda para comprobar tus resultados.\n# Compara lo que obtuviste con el valor esperado y muestra ✔ o ✘ (no necesitas entenderla).\nESPERADO = {\n    'fecha_nulas': 6, 'total_viajes': 6, 'total_importe': 120.0,\n    'por_servicio': {'ESTANDAR': (3, 60.0, 50.0), 'EJECUTIVO': (2, 35.0, 29.17),\n                     'ENCOMIENDA': (1, 25.0, 20.83)},\n    'promedio': {'Comas': (21.67, 30.0), 'Independencia': (25.0, 25.0), 'Los Olivos': (15.0, 20.0)},\n    'particiones3': 3, 'particiones4': 4, 'comas_viajes': 3, 'comas_importe': 65,\n    'totales_rdd': {'Comas': 65, 'Independencia': 25, 'Los Olivos': 30},\n    'particiones_por_distrito': 2,\n    'totales_csv': {'Comas': 65.0, 'Independencia': 25.0, 'Los Olivos': 30.0},\n}\ndef verificar(nombre, obtenido):\n    if obtenido == ESPERADO[nombre]:\n        print('✔', nombre, 'correcto')\n    else:\n        print('✘', nombre, 'no coincide. Obtuviste:', obtenido)\n        print('   Revisa los comentarios numerados del TODO y vuelve a ejecutar.')");

    <tr><td>Sur</td><td class="n">200</td><td class="n">11.900</td><td class="n">59.50</td></tr><tr><td>Centro</td><td class="n">200</td><td class="n">7.900</td><td class="n">39.50</td></tr><tr><td>Norte</td><td class="n">200</td><td class="n">3.900</td><td class="n">19.50</td></tr>
    <tr class="tot"><td>Total plástico</td><td class="n">600</td><td class="n">23.700</td><td></td></tr></tbody></table></div>
    <p>23.700 t es un subconjunto de 35.994 t (todos los residuos): la diferencia es de contexto de filtro, no pérdida de registros.</p>` + CODE("# Reto. Escribe aquí tu solución completa.\n# Reutiliza lo practicado en E03, E04 y E05. No modifiques los archivos originales.\nbase_reto = spark.read.parquet(str(SALIDA / 'detalle_parquet'))\nprint('Filas:', base_reto.count())\nbase_reto.createOrReplaceTempView('reto_residuos')\nreto = spark.sql(\"\"\"\n    SELECT Region,\n           COUNT(*) AS Pesajes,\n           ROUND(SUM(PesoKg) / 1000.0, 3) AS ToneladasPlastico,\n           ROUND(AVG(PesoKg), 2) AS PromedioKgPorPesaje\n    FROM reto_residuos\n    WHERE TipoResiduo = 'PLASTICO'\n    GROUP BY Region\n    ORDER BY ToneladasPlastico DESC\n\"\"\")\nreto.show()\nprint('Suma de pesajes:', sum(r.Pesajes for r in reto.collect()))\nreto.toPandas().to_csv('reto_plastico.csv', index=False, encoding='utf-8-sig')", "py", "Solución docente · celda de Colab") }

{ id: "dz", mod: "doc", t: "Ampliación docente: sensores", sub: "Opcional",
  blocks: [

    <div class="legend">${REGIONES.map(r => `<span><i style="background:${COLOR_REG[r]}"></i>${r}</span>`).join("")}</div>

{ id: "fz", mod: "src", t: "Fuentes", sub: "Fuentes", blocks: [{ k: "fuentes" }] }

<script>
"use strict";
/* =======================================================================
   7a. ESTADO Y PROGRESO (localStorage, si el navegador lo permite)
   ======================================================================= */
const KEY = "upn-t07-spark-sim-v2";
const FRESH = () => ({ scr: "s1a", a: {}, notes: {}, ev: {}, sim: {}, proj: false, doc: false });
let S = FRESH();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) { }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function A(id) { return S.a[id] || (S.a[id] = { tries: 0, hints: 0, solved: false, first: false, sol: false, exp: false, val: {} }); }

const SCR_IDX = {}; SCREENS.forEach((s, i) => SCR_IDX[s.id] = i);
const ACT_SCR = {}; SCREENS.forEach(s => s.blocks.forEach(b => { if (b.k === "a") ACT_SCR[b.id] = s.id; }));
const ACT_IDS = Object.keys(ACT).filter(id => ACT_SCR[id]);
const modOf = id => SCREENS[SCR_IDX[ACT_SCR[id]]].mod;
const visibleScreens = () => SCREENS.filter(s => !MODS.find(m => m.id === s.mod).docOnly || S.doc);
const SES_MODS = { 1: ["s1p", "e1", "e2", "s1c"], 2: ["s2p", "e3", "e4", "e5", "s2c"] };
function stats(ids) { const st = ids.map(A); return { n: ids.length, solved: st.filter(s => s.solved).length, first: st.filter(s => s.first).length, hints: st.reduce((a, s) => a + s.hints, 0), sols: st.filter(s => s.sol).length }; }
function conceptStatus(c) {
  const ids = ACT_IDS.filter(id => ACT[id].c === c), st = ids.map(A);
  if (!st.some(s => s.tries || s.solved || s.hints || s.sol)) return "pen";
  return st.every(s => s.solved) && !st.some(s => s.sol) && st.reduce((a, s) => a + s.hints, 0) <= ids.length ? "dom" : "rep";
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

/* =======================================================================
   2. NAVEGACIÓN
   ======================================================================= */
function go(id, focus = true) {
  const vis = visibleScreens();
  if (!vis.find(s => s.id === id)) id = vis[0].id;
  S.scr = id; save(); renderAll();
  $("#rail").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
  if (focus) { window.scrollTo({ top: 0 }); $("#main").focus({ preventScroll: true }); }
  try { history.replaceState(null, "", "#" + id); } catch (e) { }
}
function renderRail() {
  const cur = SCREENS[SCR_IDX[S.scr]];
  let h = "";
  MODS.forEach(m => {
    if (m.docOnly && !S.doc) return;
    if (m.ses) h += `<div class="sess">${m.ses}</div>`;
    const scr = SCREENS.filter(s => s.mod === m.id), ids = ACT_IDS.filter(id => modOf(id) === m.id), st = stats(ids);
    const isCur = cur.mod === m.id, full = st.n && st.solved === st.n;
    h += `<div class="mod ${isCur ? "cur" : ""} ${full ? "full" : ""}"><button class="mod-btn" type="button" data-go="${scr[0].id}"><span class="mod-n" aria-hidden="true">${m.n}</span><span class="mod-t">${m.t}<small>${m.s}</small></span><span class="mod-p">${st.n ? st.solved + "/" + st.n : ""}</span></button>`;
    if (isCur && scr.length > 1) h += `<ol class="steps">${scr.map(s => {
      const a = s.blocks.filter(b => b.k === "a").map(b => b.id), done = a.length && a.every(i => A(i).solved), some = a.some(i => A(i).tries || A(i).solved);
      return `<li><button type="button" data-go="${s.id}" aria-current="${s.id === S.scr}"><span class="dot ${done ? "done" : some ? "half" : ""}" aria-hidden="true"></span><span>${esc(s.t)}</span></button></li>`;
    }).join("")}</ol>`;
    h += "</div>";
  });
  h += `<div class="rail-foot">El avance se guarda en este navegador.<br><span id="resetZone"><button type="button" class="linkbtn" data-do="resetall">Reiniciar todo</button></span><span class="rail-credito">Diseño didáctico: Ing. Andrés E. Araujo Acuña · 2026</span></div>`;
  $("#rail").innerHTML = h;
}
function updateHeader() {
  const cur = SCREENS[SCR_IDX[S.scr]], mod = MODS.find(m => m.id === cur.mod);
  const inMod = SCREENS.filter(s => s.mod === cur.mod), pos = inMod.indexOf(cur) + 1;
  $("#whereT").innerHTML = `<b>${esc(mod.t)}</b> · ${inMod.length > 1 ? `paso ${pos} de ${inMod.length} · ` : ""}${esc(cur.t)}`;
  const st = stats(ACT_IDS), p = Math.round(100 * st.solved / st.n);
  $("#barFill").style.width = p + "%"; $("#pctTxt").textContent = p + " %"; $("#barWrap").setAttribute("aria-valuenow", p);
}
function pagerHTML() {
  const vis = visibleScreens(), i = vis.findIndex(s => s.id === S.scr), prev = vis[i - 1], next = vis[i + 1];
  return `<nav class="pager" aria-label="Anterior y siguiente">${prev ? `<button class="btn" type="button" data-go="${prev.id}">← Anterior: ${esc(prev.t)}</button>` : "<span></span>"}${next ? `<button class="btn pri" type="button" data-go="${next.id}">Siguiente: ${esc(next.t)} →</button>` : "<span></span>"}</nav>`;
}
const LAB = { sit: "Situación", con: "Concepto", pred: "Predicción", int: "Interacción", res: "Resultado", expl: "Explicación", colab: "En Colab", doc: "Solo docente" };
function head(n, kind, title) { return `<header><span class="n" aria-hidden="true">${n}</span><span class="lab">${LAB[kind]}</span>${title ? `<h3>${title}</h3>` : ""}</header>`; }
function renderMain() {
  const s = SCREENS[SCR_IDX[S.scr]], mod = MODS.find(m => m.id === s.mod);
  let h = `<article class="screen"><div class="kicker"><span class="pill dark">${esc(mod.t)}</span><span class="pill time">${esc(mod.s)}</span>${mod.docOnly ? '<span class="pill doc">Modo docente</span>' : ""}</div><h1>${esc(s.t)}</h1><div class="stack">`;
  let n = 0;
  s.blocks.forEach(b => {
    if (b.k === "doc" && !S.doc) return;
    if (b.k === "a") { n++; h += actHTML(b.id, b.as || "int", n); return; }
    if (b.k === "sim") { n++; h += `<section class="blk int">${head(n, "int", b.h)}${SIMTAG}<div class="simbox" data-sim="${b.sim}"></div></section>`; return; }
    if (b.k === "cierre") { h += cierreHTML(b.ses); return; }
    if (b.k === "fuentes") { h += fuentesHTML(); return; }
    n++;
    if (b.k === "expl") h += `<section class="blk expl">${head(n, "expl", "")}<details class="more"><summary>${esc(b.h)}</summary>${b.html}</details></section>`;
    else h += `<section class="blk ${b.k}">${head(n, b.k, b.h)}${b.html}</section>`;
  });
  h += `</div>${pagerHTML()}</article>`;
  $("#main").innerHTML = h;
  $$(".simbox").forEach(el => SIMS[el.dataset.sim] && SIMS[el.dataset.sim](el));
}
function renderAll() { renderRail(); renderMain(); updateHeader(); }

/* =======================================================================
   4b. RENDER DE ACTIVIDADES
   ======================================================================= */
const HN = ["Pista 1 · orientación", "Pista 2 · estructura", "Pista 3 · parte de la respuesta"];
const hintHTML = (t, i) => `<div class="hint"><span class="h">${HN[i]}</span>${t}</div>`;
const solHTML = d => `<div class="sol"><span class="h">Solución docente</span>${d.sol}</div>`;
const expHTML = d => `<div class="exp"><span class="h">Explicación</span>${d.exp}</div>`;
function actBody(id) {
  const d = ACT[id], v = A(id).val;
  let b = "";
  if (d.sim && d.type !== "mission") b += SIMTAG + `<div class="simbox" data-sim="${d.sim}" style="margin-bottom:14px"></div>`;
  switch (d.type) {
    case "choice": case "multi":
      b += `<div class="opts" role="group">${d.opts.map((o, i) => { const on = d.type === "choice" ? v.pick === i : (v.picks || []).includes(i); return `<button type="button" class="opt ${d.type === "multi" ? "multi" : ""}" data-act="${id}" data-opt="${i}" aria-pressed="${on}"><span class="mk" aria-hidden="true"></span><span>${esc(o.t)}</span></button>`; }).join("")}</div>`;
      if (d.type === "multi") b += `<small>Puedes marcar varias opciones.</small>`; break;
    case "match":
      b += `<div class="grid-m">${d.items.map((it, i) => `<div class="it">${esc(it.l)}</div><select id="${id}-m${i}" data-act="${id}" data-k="m${i}" aria-label="${esc(it.l)}"><option value="">Elige…</option>${d.choices.map(c => `<option${v["m" + i] === c ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>`).join("")}</div>`; break;
    case "fill": {
      const parts = d.code.split(/\[\[(\w+)\]\]/), keys = Object.keys(d.blanks);
      let code = "";
      parts.forEach((p, i) => { if (i % 2 === 0) code += hl(p, d.lang); else { const bl = d.blanks[p], w = Math.max(bl.w || 8, (v[p] || "").length + 1); code += `<input class="blank" id="${id}-${p}" data-act="${id}" data-k="${p}" value="${esc(v[p] || "")}" size="${w}" spellcheck="false" autocomplete="off" aria-label="Espacio ${keys.indexOf(p) + 1}">`; } });
      b += `<div class="cw"><div class="cbar"><span>Completa los espacios · se valida contra respuestas admitidas</span></div><pre class="code">${code}</pre></div>`; break;
    }
    case "fields":
      b += `<div class="fields">${d.fields.map(f => { const val = v[f.k] || ""; if (f.kind === "select") return `<label for="${id}-${f.k}">${esc(f.l)}<select id="${id}-${f.k}" data-act="${id}" data-k="${f.k}"><option value="">Elige…</option>${f.opts.map(o => `<option${val === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
        return `<label for="${id}-${f.k}">${esc(f.l)}<input class="f" id="${id}-${f.k}" data-act="${id}" data-k="${f.k}" value="${esc(val)}" ${f.kind === "num" ? 'inputmode="decimal"' : ""} autocomplete="off" spellcheck="false"></label>`; }).join("")}</div>`; break;
    case "text":
      b += `<div class="fields wide">${d.parts.map(p => `<label for="${id}-${p.k}">${esc(p.l)}<textarea id="${id}-${p.k}" data-act="${id}" data-k="${p.k}">${esc(v[p.k] || "")}</textarea></label>`).join("")}</div><small>Se revisa que nombres las ideas clave; la redacción es tuya.</small>`; break;
    case "mission":
      b += SIMTAG + `<div class="simbox" data-sim="${d.sim}"></div><h4 style="margin:14px 0 6px;font-size:.9rem">Tareas</h4><ul class="checkl" id="${id}-mis">${missionItems(id)}</ul>`; break;
    case "cards":
      b += `<div class="reccards">${d.cards.map((c, i) => `<div class="reccard" id="${id}-card${i}"><div class="rec">${esc(c.rec)}</div><select id="${id}-c${i}" data-act="${id}" data-k="c${i}" aria-label="Motivo de: ${esc(c.rec)}"><option value="">Elige el motivo…</option>${d.opts.map(o => `<option${v["c" + i] === o ? " selected" : ""}>${o}</option>`).join("")}</select><details><summary style="cursor:pointer;font-size:.86rem;color:var(--info);font-weight:700">Revelar explicación</summary><p style="margin:6px 0 0;font-size:.9rem">${esc(c.why)}</p></details></div>`).join("")}</div>`; break;
  }
  return b;
}
function actHTML(id, as, n) {
  const d = ACT[id], st = A(id);
  return `<section class="blk ${as} ${st.solved ? "solved" : ""}" id="act-${id}" data-as="${as}">${head(n, as, "")}
    <p class="q">${esc(d.q)}</p><div id="body-${id}">${actBody(id)}</div>
    <div class="actions">
      <button class="btn pri" type="button" data-do="val" data-act="${id}">Comprobar</button>
      <button class="btn" type="button" data-do="hint" data-act="${id}" ${st.hints >= 3 ? "disabled" : ""}>${st.hints >= 3 ? "Sin más pistas" : "Pista " + (st.hints + 1)}</button>
      <button class="btn ghost" type="button" data-do="exp" data-act="${id}" ${st.tries || st.solved ? "" : 'disabled title="Disponible después de comprobar"'}>${st.exp ? "Ocultar explicación" : "Mostrar explicación"}</button>
      ${S.doc ? `<button class="btn docb" type="button" data-do="sol" data-act="${id}">${st.sol ? "Ocultar solución docente" : "Solución docente"}</button>` : ""}
      <button class="btn ghost" type="button" data-do="reset" data-act="${id}">Reiniciar actividad</button>
    </div>
    <div id="fb-${id}" role="status" aria-live="polite">${st.solved ? `<div class="fb ok"><span class="ttl">✓ Resuelto${st.first ? " al primer intento" : ""}.</span></div>` : ""}</div>
    <div id="hints-${id}">${d.h.slice(0, st.hints).map(hintHTML).join("")}</div>
    <div id="exp-${id}">${st.exp ? expHTML(d) : ""}</div>
    <div id="sol-${id}">${st.sol && S.doc ? solHTML(d) : ""}</div></section>`;
}
function missionItems(id) { const m = A(id).val.m || {}; return ACT[id].missions.map(([k, t]) => `<li><label><input type="checkbox" disabled ${m[k] ? "checked" : ""}> <span>${m[k] ? "✓ " : ""}${esc(t)}</span></label></li>`).join(""); }
function rerenderAct(id) { const el = $("#act-" + id); if (!el) return; const n = el.querySelector("header .n").textContent; el.outerHTML = actHTML(id, el.dataset.as, n); $$(`#act-${id} .simbox`).forEach(x => SIMS[x.dataset.sim] && SIMS[x.dataset.sim](x)); }

/* =======================================================================
   5. VALIDADORES (respuestas controladas; nunca se ejecuta código)
   ======================================================================= */
const matchAcc = (n, acc) => acc.some(a => a instanceof RegExp ? a.test(n) : normCode(a) === n);
const V = {
  choice(d, st) { if (st.val.pick == null) return { ok: false, msgs: ["Elige una opción."] }; const o = d.opts[st.val.pick]; return { ok: !!o.ok, msgs: [o.fb || ""], mark: { [st.val.pick]: o.ok ? "ok" : "bad" } }; },
  multi(d, st) {
    const p = st.val.picks || []; if (!p.length) return { ok: false, msgs: ["Marca al menos una opción."] };
    const msgs = [], mark = {};
    p.forEach(i => { mark[i] = d.opts[i].ok ? "ok" : "bad"; if (!d.opts[i].ok) msgs.push(d.opts[i].fb || `«${d.opts[i].t}» no corresponde.`); });
    const miss = d.opts.filter((o, i) => o.ok && !p.includes(i)).length;
    if (miss) msgs.push(`Te falta${miss > 1 ? "n" : ""} ${miss} opción${miss > 1 ? "es" : ""} correcta${miss > 1 ? "s" : ""}.`);
    return { ok: !msgs.length, msgs, mark };
  },
  match(d, st) {
    const msgs = [], mark = {};
    d.items.forEach((it, i) => { const v = st.val["m" + i]; if (!v) { msgs.push(`Falta relacionar «${it.l}».`); return; } const ok = v === it.a; mark["m" + i] = ok ? "ok" : "bad"; if (!ok) msgs.push(`«${it.l}» no corresponde a «${v}».`); });
    return { ok: !msgs.length, msgs: msgs.slice(0, 5), mark };
  },
  cards(d, st) {
    const msgs = [], mark = {};
    d.cards.forEach((c, i) => { const v = st.val["c" + i]; if (!v) { msgs.push(`Falta clasificar: ${c.rec}.`); return; } const ok = v === c.a; mark["c" + i] = ok ? "ok" : "bad"; if (!ok) msgs.push(`${c.rec}: revisa el orden de las reglas.`); });
    return { ok: !msgs.length, msgs: msgs.slice(0, 5), mark };
  },
  fill(d, st) {
    const msgs = [], mark = {};
    Object.keys(d.blanks).forEach((k, i) => {
      const b = d.blanks[k], raw = st.val[k] || "", n = normCode(raw), lab = `Espacio ${i + 1}`;
      if (!raw.trim()) { msgs.push(`${lab}: está vacío.`); mark[k] = "bad"; return; }
      if (matchAcc(n, b.acc)) { mark[k] = "ok"; return; }
      mark[k] = "bad"; const w = (b.wrong || []).find(([re]) => re.test(n));
      msgs.push(`${lab}: ${w ? w[1] : "no coincide con lo que pide el comentario. Pide una pista si lo necesitas."}`);
    });
    return { ok: !msgs.length, msgs, mark };
  },
  fields(d, st) {
    const msgs = [], mark = {};
    d.fields.forEach(f => {
      const raw = String(st.val[f.k] || ""); if (!raw.trim()) { msgs.push(`«${f.l}»: falta completar.`); mark[f.k] = "bad"; return; }
      let ok;
      if (f.kind === "num") { const x = parseNum(raw); ok = !isNaN(x) && Math.abs(x - f.v) <= (f.tol ?? 0.005); if (!ok) msgs.push(`«${f.l}»: ${isNaN(x) ? "escribe solo un número." : "no coincide con el control esperado; revisa el cálculo."}`); }
      else if (f.kind === "select") { ok = f.ans.includes(raw); if (!ok) msgs.push(`«${f.l}»: no es la opción correcta.`); }
      else { const n = f.code ? normCode(raw) : normTxt(raw); ok = f.acc.some(a => (f.code ? normCode(a) : normTxt(a)) === n); if (!ok) msgs.push(`«${f.l}»: no coincide con la salida esperada.`); }
      mark[f.k] = ok ? "ok" : "bad";
    });
    return { ok: !msgs.length, msgs, mark };
  },
  text(d, st) {
    const msgs = [], mark = {};
    d.parts.forEach(p => { const n = normTxt(st.val[p.k] || ""); if (n.length < 12) { msgs.push(`«${p.l}»: escribe una respuesta más completa.`); mark[p.k] = "bad"; return; } const miss = p.rub.filter(r => !r.any.some(k => n.includes(k))); mark[p.k] = miss.length ? "bad" : "ok"; miss.forEach(r => msgs.push(`«${p.l}»: ${r.miss}`)); });
    return { ok: !msgs.length, msgs, mark };
  },
  mission(d, st) { const m = st.val.m || {}, pend = d.missions.filter(([k]) => !m[k]); return { ok: !pend.length, msgs: pend.map(([, t]) => "Pendiente: " + t) }; }
};
function applyMarks(id, res) {
  const d = ACT[id], root = $("#act-" + id); if (!root) return;
  $$(".opt,select,input.f,input.blank,textarea,.reccard", root).forEach(el => el.classList.remove("ok", "bad"));
  const m = res.mark || {};
  if (d.type === "choice" || d.type === "multi") $$(".opt", root).forEach((el, i) => m[i] && el.classList.add(m[i]));
  else Object.entries(m).forEach(([k, c]) => { const el = $(`[data-k="${k}"]`, root); if (el) el.classList.add(c); if (d.type === "cards") $(`#${id}-card${k.slice(1)}`)?.classList.add(c); });
}
function validate(id) {
  const d = ACT[id], st = A(id), res = V[d.type](d, st);
  if (!st.solved) { st.tries++; if (res.ok) { st.solved = true; st.first = st.tries === 1; } }
  if (d.auto && !st.exp) st.exp = true;
  save(); applyMarks(id, res);
  const fb = $("#fb-" + id);
  fb.innerHTML = res.ok
    ? `<div class="fb ok"><span class="ttl">✓ Correcto${st.first ? " al primer intento" : ""}.</span> ${d.type === "choice" ? res.msgs[0] : ""}</div>`
    : `<div class="fb bad"><span class="ttl">✕ Revisa (intento ${st.tries}):</span><ul>${res.msgs.filter(Boolean).map(m => `<li>${m}</li>`).join("")}</ul></div>`;
  const root = $("#act-" + id); root.classList.toggle("solved", st.solved);
  const eb = $(`[data-do="exp"][data-act="${id}"]`, root); eb.disabled = false; eb.removeAttribute("title");
  if (st.exp) { $("#exp-" + id).innerHTML = expHTML(d); eb.textContent = "Ocultar explicación"; }
  if (id === "e1_pred") { const sb = $('.simbox[data-sim="viajes"]'); if (sb) SIMS.viajes(sb); }
  renderRail(); updateHeader();
}

/* =======================================================================
   6. PISTAS, EXPLICACIÓN, SOLUCIÓN DOCENTE Y REINICIO
   ======================================================================= */
function giveHint(id, btn) { const d = ACT[id], st = A(id); if (st.hints >= 3) return; $("#hints-" + id).insertAdjacentHTML("beforeend", hintHTML(d.h[st.hints], st.hints)); st.hints++; save(); btn.textContent = st.hints >= 3 ? "Sin más pistas" : "Pista " + (st.hints + 1); btn.disabled = st.hints >= 3; }
function toggleExp(id, btn) { const st = A(id); st.exp = !st.exp; save(); $("#exp-" + id).innerHTML = st.exp ? expHTML(ACT[id]) : ""; btn.textContent = st.exp ? "Ocultar explicación" : "Mostrar explicación"; }

/* ---- E02 · Plan perezoso ---- */
function rddState() { return S.sim.rdd || (S.sim.rdd = { plan: [], ran: {}, last: "" }); }
function rddMission(k) {
  const st = A("e2_plan"); st.val.m = st.val.m || {};
  if (!st.val.m[k]) { st.val.m[k] = true; save(); const ul = $("#e2_plan-mis"); if (ul) ul.innerHTML = missionItems("e2_plan"); if (ACT.e2_plan.missions.every(([q]) => st.val.m[q]) && !st.solved) validate("e2_plan"); }
}
SIMS.rdd = el => {
  const r = rddState(), has = k => r.plan.includes(k), show = r.last;
  const tupCls = x => { if (show === "count" || show === "sum") return PARES[x][0] === "Comas" ? "pass" : "drop"; return ""; };
  const part = k => `<div class="part ${k ? "p1" : ""}"><h4><span>Partición ${k}</span><small>RDD original · no cambia</small></h4>${PART[k].map(x => `<span class="tup ${tupCls(x)}" style="cursor:default"><span>'${PARES[x][0]}'</span><span>${PARES[x][1]}</span></span>`).join("")}</div>`;
  const node = (k, t) => has(k) ? `<span class="node ${r.ran[k] ? "run" : ""}">${t}${r.ran[k] ? " ✓ ejecutado" : " · pendiente"}</span>` : "";
  let out = "";
  if (show === "count") out = `comas.count() → <b>3</b>\nSe evaluó filter en las dos particiones: pasan ('Comas',15), ('Comas',20) y ('Comas',30).`;
  else if (show === "sum") out = `importes_comas.sum() → <b>65</b>\nfilter conserva Comas → map extrae importes [15, 20, 30] → sum = 15 + 20 + 30 = 65`;
  else if (show === "collect") out = `sorted(por_distrito.collect()) → <b>[('Comas', 65), ('Independencia', 25), ('Los Olivos', 30)]</b>\ncollect trae el resultado al driver (aquí solo 3 elementos).`;
  else out = r.plan.length ? "Hay transformaciones en el plan, pero ninguna acción: Spark todavía no procesó ninguna tupla." : "Agrega transformaciones al plan.";
  const shuffle = show === "collect" ? `<div class="shuffle"><div class="lanes"><div class="lane"><b>Partición 0</b> · suma local<br>Comas 15+20 = 35<br>Los Olivos 10</div><div class="lane"><b>Partición 1</b> · suma local<br>Los Olivos 20<br>Comas 30<br>Independencia 25</div></div>
    <div style="text-align:center;font-weight:700">→<br><small>shuffle<br>(wide)<br>redistribución<br>por clave</small></div>
    <div class="lanes"><div class="lane">Comas: 35 + 30 = <b>65</b></div><div class="lane">Independencia: <b>25</b></div><div class="lane">Los Olivos: 10 + 20 = <b>30</b></div></div></div><small>Reparto conceptual por clave; Spark decide internamente a qué partición va cada clave.</small>` : "";
  el.innerHTML = `<div class="envbox"><div class="t">RDD original: rdd = parallelize(datos, 2)</div><div class="parts">${part(0)}${part(1)}</div></div>
   <h4 style="margin:14px 0 6px;font-size:.9rem">Transformaciones (se agregan al plan)</h4>
   <div class="toolbar"><button type="button" class="btn" data-rd="f" ${has("f") ? "disabled" : ""}>+ filter(fila[0] == 'Comas')</button><button type="button" class="btn" data-rd="m" ${has("m") || !has("f") ? "disabled" : ""}>+ map(fila[1])</button><button type="button" class="btn" data-rd="r" ${has("r") ? "disabled" : ""}>+ reduceByKey(a + b)</button></div>
   <div class="plan" aria-live="polite"><span class="node" style="border-style:solid">rdd</span>${has("f") ? "→" : ""}${node("f", "comas = filter · narrow")}${has("m") ? "→" : ""}${node("m", "importes_comas = map · narrow")}${has("r") ? '<span style="margin-left:14px">rdd →</span>' : ""}${node("r", "por_distrito = reduceByKey · wide")}${r.plan.length ? "" : '<small>Plan vacío</small>'}</div>
   <h4 style="margin:14px 0 6px;font-size:.9rem">Acciones (piden un resultado)</h4>
   <div class="toolbar"><button type="button" class="btn pri" data-rd="count" ${has("f") ? "" : "disabled"}>comas.count()</button><button type="button" class="btn pri" data-rd="sum" ${has("m") ? "" : "disabled"}>importes_comas.sum()</button><button type="button" class="btn pri" data-rd="collect" ${has("r") ? "" : "disabled"}>por_distrito.collect()</button><button type="button" class="btn ghost" data-rd="reset">Vaciar plan</button></div>
   <div class="out" aria-live="polite">${out}</div>${shuffle}`;
};
function rddAction(k) {
  const r = rddState();
  if (k === "reset") { S.sim.rdd = { plan: [], ran: {}, last: "" }; }
  else if (["f", "m", "r"].includes(k)) { if (!r.plan.includes(k)) r.plan.push(k); r.last = ""; rddMission(k); }
  else { r.last = k; if (k === "count") r.ran.f = true; if (k === "sum") { r.ran.f = true; r.ran.m = true; } if (k === "collect") r.ran.r = true; rddMission(k); }
  save(); rerender("rdd");
}

   <div class="tw"><table class="rs"><thead><tr><th>TipoResiduo</th><th class="n">PesoKg</th><th class="n">NumVoluntarios (repetido en el detalle)</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="toolbar" style="margin-top:10px"><button type="button" class="tab" data-vm="pesaje" aria-pressed="${m === "pesaje"}">Sumar NumVoluntarios por pesaje</button><button type="button" class="tab" data-vm="jornada" aria-pressed="${m === "jornada"}">Agrupar por jornada primero</button></div>

};

   ${REGIONES.map(r => `<tr><td>${r}</td><td class="n">${REG[r].jor}</td><td class="n">${dec(REG[r].media)}</td><td class="n">${dec(REG[r].sd)}</td><td class="n">${dec(REG[r].ratio)}</td><td class="n">${REG[r].alto}</td><td class="n">${REG[r].bajo}</td></tr>`).join("")}

   <div class="toolbar" style="margin-top:10px"><button type="button" class="btn" data-st="sum">Intentar sumar las tres medias</button></div>
   ${sumTry ? `<div class="fb bad">749.90 + 398.08 + 295.63 = 1443.61 → <b>sin significado</b>. Una media no es una cantidad aditiva: no representa a ninguna jornada ni a la suma de regiones.</div>` : ""}`;

SIMS.parquet = el => {

/* ---- E05 · Reporte Power BI (maqueta) ---- */
SIMS.report = el => {
  const r = S.sim.rep || (S.sim.rep = { regs: REGIONES.slice(), ds: "res" });
  if (r.ds === "reto" && !S.doc) r.ds = "res";
  const reto = r.ds === "reto", vis = REGIONES.filter(x => r.regs.includes(x));
  const val = x => reto ? REG[x].plas / 1000 : REG[x].kg / 1000;
  const rows = vis.map(x => ({ k: x, v: val(x), c: COLOR_REG[x] })).sort((a, b) => b.v - a.v);
  const total = rows.reduce((a, x) => a + x.v, 0);
  const table = reto
    ? `<thead><tr><th>Region</th><th class="n">Pesajes</th><th class="n">PromedioKgPorPesaje</th></tr></thead><tbody>${vis.map(x => `<tr><td>${x}</td><td class="n">200</td><td class="n">${dec(REG[x].plas / 200)}</td></tr>`).join("")}</tbody>`
    : `<thead><tr><th>Region</th><th class="n">MediaVolPorTon</th><th class="n">DesvMuestral</th></tr></thead><tbody>${vis.map(x => `<tr><td>${x}</td><td class="n">${dec(REG[x].media)}</td><td class="n">${dec(REG[x].sd)}</td></tr>`).join("")}</tbody>`;
  el.innerHTML = `<div class="toolbar"><b style="font-size:.86rem">Filtro Region:</b>${REGIONES.map(x => `<button type="button" class="chip" data-rr="${x}" aria-pressed="${r.regs.includes(x)}">${r.regs.includes(x) ? "✓ " : ""}${x}</button>`).join("")}
     ${S.doc ? `<span style="margin-left:auto"></span><button type="button" class="chip" data-rds="res" aria-pressed="${!reto}">resumen_region.csv</button><button type="button" class="chip" data-rds="reto" aria-pressed="${reto}">reto_plastico.csv (docente)</button>` : ""}</div>
   <div class="report"><div class="tile"><h5>${reto ? "¿En qué región se recolectó más plástico? (toneladas)" : "¿En qué región se recolectó más peso de residuos? (toneladas)"}</h5>${rows.length ? hbars(rows, "t", 20) : "<small>Sin regiones seleccionadas.</small>"}</div>
   <div class="tile"><h5>${reto ? "Toneladas de plástico" : "Toneladas recolectadas"}</h5><div class="kpi">${dec(total, 3)}</div><div class="kpi-sub">Suma de ${reto ? "ToneladasPlastico" : "Toneladas"} · ${vis.length} región(es)</div></div>
   <div class="tile wide"><h5>${reto ? "Pesajes y promedio por pesaje" : "Voluntarios por tonelada de plástico (sin resumir)"}</h5><div class="tw"><table class="rs">${table}</table></div></div></div>
   <small>Maqueta: reproduce lo que Power BI mostraría con el CSV; no ejecuta Power BI.</small>`;
};

/* ---- E05 · Reto: cronómetro y lista ---- */
let retoTimer = null;
SIMS.reto = el => {
  const t = S.sim.reto || (S.sim.reto = { left: 900, run: false, chk: {} });
  const mm = String(Math.floor(t.left / 60)).padStart(2, "0"), ss = String(t.left % 60).padStart(2, "0");
  const steps = ["Leí el Parquet en base_reto (1800 filas)", "Registré reto_residuos y filtré PLASTICO antes de agrupar", "Calculé Pesajes, ToneladasPlastico y PromedioKgPorPesaje", "Comprobé 3 regiones y 600 pesajes; descargué reto_plastico.csv", "Escribí la interpretación de dos líneas"];
  el.innerHTML = `<div class="two"><div class="panel"><b>Tiempo del reto</b><div class="timer num" aria-live="off">${mm}:${ss}</div>
    <div class="toolbar" style="margin:6px 0 0"><button type="button" class="btn pri" data-rt="toggle">${t.run ? "Pausar" : t.left < 900 ? "Continuar" : "Iniciar 15 min"}</button><button type="button" class="btn ghost" data-rt="reset">Reiniciar tiempo</button></div>${t.left === 0 ? '<p class="fb bad" style="margin-top:8px">Tiempo terminado.</p>' : ""}</div>
    <div class="panel"><b>Lista del reto</b><ul class="checkl" style="margin-top:6px">${steps.map((s, i) => `<li><label><input type="checkbox" id="rchk${i}" data-rc="${i}" ${t.chk[i] ? "checked" : ""}> <span>${s}</span></label></li>`).join("")}</ul></div></div>`;
};
function retoTick() {
  const t = S.sim.reto; if (!t || !t.run) { clearInterval(retoTimer); retoTimer = null; return; }
  t.left = Math.max(0, t.left - 1); if (!t.left) t.run = false; save();
  const el = $('.simbox[data-sim="reto"]'); if (el) { const tm = el.querySelector(".timer"); if (tm && t.left) tm.textContent = `${String(Math.floor(t.left / 60)).padStart(2, "0")}:${String(t.left % 60).padStart(2, "0")}`; else SIMS.reto(el); }
}

/* =======================================================================
   7b. CIERRES, LOGROS Y FUENTES
   ======================================================================= */
const EVID = {
  1: ["Cuaderno de la sesión 1 ejecutado de arriba hacia abajo y guardado como .ipynb, con las salidas visibles", "Captura de los ✔ de los TODO 1, 1b, 2 y 3", "Captura de los ✔ de los TODO 4 a 7", "Respuestas 1, 2 y 3 escritas en las celdas del cuaderno"],
  2: ["Cuaderno de la sesión 2 ejecutado de arriba hacia abajo con salidas visibles y los ✔ de los TODO 1 a 7", "Respuestas 1 a 4 (la 4 es el TODO 8) y preguntas de cierre", "resumen_region.csv y resultados_tema07.zip", "OceanCleanUp_Tema07.pbix", "Captura del reporte con título, unidades y total sin filtros (35.994 t)", "Opcional: reto_plastico.csv y respuesta de dos líneas"]
};

  const ids = ACT_IDS.filter(id => SES_MODS[ses].includes(modOf(id))), st = stats(ids);
  const cs = [...new Set(ids.map(id => ACT[id].c))], L = { dom: "Dominado", rep: "Repasar", pen: "Pendiente" };

    <ul class="checkl" style="margin-top:12px">${cs.map(c => { const s = conceptStatus(c); return `<li><span class="pill ${s === "dom" ? "dark" : s === "rep" ? "time" : ""}" style="${s === "pen" ? "border:1px solid var(--line-strong)" : ""}">${L[s]}</span> ${esc(CONCEPTOS[c])}</li>`; }).join("")}</ul>

   <section class="blk colab"><header><span class="lab">Evidencias de la sesión ${ses}</span></header><ul class="checkl">${EVID[ses].map((e, i) => `<li><label><input type="checkbox" id="ev${ses}-${i}" data-ev="${ses}-${i}" ${S.ev[ses + "-" + i] ? "checked" : ""}> <span>${esc(e)}</span></label></li>`).join("")}</ul>
    <p style="margin-top:8px"><small>Descarga el cuaderno y los archivos antes de cerrar Colab: la máquina es temporal.</small></p></section>

/* =======================================================================
   EVENTOS
   ======================================================================= */
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.go) { go(b.dataset.go); return; }
  const id = b.dataset.act;
  if (b.dataset.do) {
    const d = b.dataset.do;
    if (d === "val") validate(id); else if (d === "hint") giveHint(id, b); else if (d === "exp") toggleExp(id, b);
    else if (d === "sol") toggleSol(id, b); else if (d === "reset") resetAct(id);
    else if (d === "resetall") $("#resetZone").innerHTML = `¿Borrar todo el avance? <button type="button" class="linkbtn" data-do="resetyes">Sí, borrar</button> · <button type="button" class="linkbtn" style="color:var(--ink)" data-do="resetno">No</button>`;
    else if (d === "resetyes") { const pj = S.proj, dc = S.doc; S = FRESH(); S.proj = pj; S.doc = dc; save(); go("s1a"); toast("Avance reiniciado"); }
    else if (d === "resetno") renderRail();
    return;
  }
  if (b.dataset.opt != null) {
    const d = ACT[id], st = A(id), i = +b.dataset.opt;
    if (d.type === "choice") { st.val.pick = i; $$(`[data-act="${id}"][data-opt]`).forEach(o => { o.setAttribute("aria-pressed", o === b); o.classList.remove("ok", "bad"); }); }
    else { const p = st.val.picks || (st.val.picks = []), k = p.indexOf(i); k >= 0 ? p.splice(k, 1) : p.push(i); b.setAttribute("aria-pressed", k < 0); $$(`[data-act="${id}"][data-opt]`).forEach(o => o.classList.remove("ok", "bad")); }
    save(); return;
  }
  if (b.dataset.copy != null) {
    const txt = COPYBUF[+b.dataset.copy];
    const fallback = () => { const pre = b.closest(".cw").querySelector("pre"); const rg = document.createRange(); rg.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Código seleccionado: usa Ctrl+C"); };
    try { navigator.clipboard.writeText(txt).then(() => { b.textContent = "Copiado ✓"; setTimeout(() => b.textContent = "Copiar", 1500); }, fallback); } catch (e) { fallback(); }
    return;
  }
  if (b.dataset.city != null) { S.sim.city = +b.dataset.city; save(); rerender("ciudades"); return; }
  if (b.dataset.cl) { S.sim.cl = b.dataset.cl; save(); rerender("cluster"); $(`[data-cl="${b.dataset.cl}"]`)?.focus(); return; }
  if (b.dataset.env) { S.sim.env = b.dataset.env; save(); rerender("env"); $(`[data-env="${b.dataset.env}"]`)?.focus(); return; }
  if (b.dataset.vt) { S.sim.v.tab = b.dataset.vt; save(); rerender("viajes"); $(`[data-vt="${b.dataset.vt}"]`)?.focus(); return; }
  if (b.dataset.col) { S.sim.v.col = b.dataset.col; save(); rerender("viajes"); $(`[data-col="${b.dataset.col}"]`)?.focus(); return; }
  if (b.dataset.vg) { const v = S.sim.v; v.step = b.dataset.vg === "reset" ? 0 : b.dataset.vg === "all" ? 6 : Math.min(6, (v.step || 0) + 1); save(); rerender("viajes"); $(`[data-vg="${v.step >= 6 ? "reset" : "play"}"]`)?.focus(); return; }
  if (b.dataset.ml) { S.sim.malo = b.dataset.ml; save(); rerender("malo"); $(`[data-ml="${b.dataset.ml}"]`)?.focus(); return; }
  if (b.dataset.tup != null) { S.sim.tsel = +b.dataset.tup; save(); rerender("tuplas"); $(`[data-tup="${b.dataset.tup}"]`)?.focus(); return; }
  if (b.dataset.rd) { rddAction(b.dataset.rd); return; }
  if (b.dataset.tm) { S.sim.tonm = b.dataset.tm; save(); rerender("ton"); return; }
  if (b.dataset.vm) { S.sim.volm = b.dataset.vm; save(); rerender("vol"); return; }
  if (b.dataset.st) { S.sim.sumTry = true; save(); rerender("stats"); return; }
  if (b.dataset.pq) { S.sim.pqOpen = !S.sim.pqOpen; save(); rerender("parquet"); $("[data-pq]")?.focus(); return; }
  if (b.dataset.rr) { const r = S.sim.rep, x = b.dataset.rr; r.regs = r.regs.includes(x) ? r.regs.filter(y => y !== x) : REGIONES.filter(y => r.regs.includes(y) || y === x); save(); rerender("report"); $(`[data-rr="${x}"]`)?.focus(); return; }
  if (b.dataset.rds) { S.sim.rep.ds = b.dataset.rds; save(); rerender("report"); return; }
  if (b.dataset.rt) {
    const t = S.sim.reto;
    if (b.dataset.rt === "reset") { t.left = 900; t.run = false; } else { if (t.left === 0) t.left = 900; t.run = !t.run; }
    save(); if (t.run && !retoTimer) retoTimer = setInterval(retoTick, 1000); rerender("reto"); return;
  }
});
function onInput(ev) {
  const el = ev.target;
  if (el.dataset.act && el.dataset.k) { A(el.dataset.act).val[el.dataset.k] = el.value; el.classList.remove("ok", "bad"); if (el.classList.contains("blank")) el.size = Math.max(+el.getAttribute("size") || 4, el.value.length + 1); save(); return; }
  if (el.dataset.note) { S.notes[el.dataset.note] = el.value; save(); return; }
  if (el.dataset.ev) { S.ev[el.dataset.ev] = el.checked; save(); return; }
  if (el.dataset.rc) { S.sim.reto.chk[el.dataset.rc] = el.checked; save(); return; }
}
document.addEventListener("input", onInput);
document.addEventListener("change", ev => { if (ev.target.tagName === "SELECT" || ev.target.type === "checkbox") onInput(ev); });
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.matches("input.blank, input.f")) { ev.preventDefault(); validate(ev.target.dataset.act); } });

function applyPrefs() {
  document.documentElement.classList.toggle("proj", !!S.proj);
  $("#projBtn").setAttribute("aria-pressed", !!S.proj);
  $("#docBtn").setAttribute("aria-pressed", !!S.doc);
  $("#docBtn").textContent = S.doc ? "Ocultar solución docente" : "Mostrar solución docente";
}
$("#projBtn").addEventListener("click", () => { S.proj = !S.proj; save(); applyPrefs(); });
$("#docBtn").addEventListener("click", () => { S.doc = !S.doc; save(); applyPrefs(); renderAll(); toast(S.doc ? "Modo docente activo: organiza la explicación; no es un sistema de seguridad" : "Modo docente desactivado"); });
$("#menuBtn").addEventListener("click", () => { const o = $("#rail").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); });

window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h in SCR_IDX && h !== S.scr) go(h); });
applyPrefs();
if (S.sim.reto) S.sim.reto.run = false;
const hash = (location.hash || "").slice(1);
go(hash in SCR_IDX ? hash : S.scr, false);
</script>
