<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Simulador Spark Tema 07</title>
<style>
/* =====================================================================
   COLORES Y TEXTOS BASE (el docente puede cambiar estos valores)
   Diseño de un solo tema claro, pensado para proyectar.
   Acento UPN: #FDBA30 (siempre con texto negro encima).
   ===================================================================== */
:root{
  color-scheme:light;
  --upn:#FDBA30; --upn-soft:#FFF4D6; --upn-line:#E7A300;
  --bg:#F3F3F0; --surface:#FFFFFF; --surface-2:#F8F8F5; --ink:#141414; --ink-2:#3B3B38;
  --muted:#5F5F5A; --line:#DCDBD4; --line-strong:#ADABA2;
  --concept:#6A1FB8; --concept-bg:#F4EEFC;
  --info:#0A5F99; --info-bg:#E7F3FB;
  --ok:#0B7A41; --ok-bg:#E2F3E9; --bad:#B8143A; --bad-bg:#FCE7EB; --warn-bg:#FFF4D6;
  --code-bg:#1E1E1E; --code-ink:#D4D4D4; --code-kw:#569CD6; --code-fn:#DCDCAA; --code-str:#CE9178;
  --code-num:#B5CEA8; --code-cm:#6A9955; --code-par:#9CDCFE;
  /* Series validadas para daltonismo (fondo claro) */
  --s-norte:#0090D6; --s-centro:#C98A00; --s-sur:#9500FF;
  --p0:#0090D6; --p1:#C98A00;
  --f:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;
  --f-code:Consolas,"Cascadia Mono","SF Mono",Menlo,"Liberation Mono",monospace;
  --fs:16px;
}
:root.proj{--fs:20px}
*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--f);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
h1,h2,h3,h4{line-height:1.2;margin:0;text-wrap:balance}
p{margin:0 0 .7em;max-width:72ch}
code{font-family:var(--f-code);font-size:.9em;background:#EEEDE7;padding:.05em .35em;border-radius:3px}
small{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Cabecera ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#141414;color:#fff;border-bottom:5px solid var(--upn)}
.hdr-in{display:flex;align-items:center;gap:16px;padding:9px 20px;max-width:1500px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:1.02rem}
.brand b span{color:var(--upn)}
.brand small{color:#BDBDB6;font-size:.76rem}
.where{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.where-t{font-size:.84rem;color:#C9C9C2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-t b{color:#fff}
.bar{height:7px;background:#333;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--upn);transition:width .35s ease}
.pct{font-weight:700;font-size:.9rem;min-width:3.4em;text-align:right}
.hbtn{border:1.5px solid #666;background:transparent;color:#fff;border-radius:6px;padding:5px 10px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.hbtn[aria-pressed="true"]{background:var(--upn);border-color:var(--upn);color:#000;font-weight:700}
.menu-btn{display:none}

/* ---------- Estructura ---------- */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:26px;max-width:1500px;margin:0 auto;padding-block:20px 80px;padding-inline:20px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.sess{font-size:.74rem;font-weight:700;color:var(--muted);margin:14px 10px 4px;letter-spacing:.04em}
.sess:first-child{margin-top:0}
.mod-btn{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.mod-btn:hover{background:var(--surface)}
.mod-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.78rem;border:2px solid var(--ink)}
.mod.cur .mod-n{background:var(--upn);border-color:var(--upn-line);color:#000}
.mod.full .mod-n{background:var(--ink);color:#fff}
.mod-t{font-weight:700;font-size:.93rem;line-height:1.2}
.mod-t small{display:block;font-weight:400;font-size:.75rem}
.mod-p{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:2px 0 8px 24px;padding:0 0 0 14px;border-left:2px solid var(--line)}
.steps button{width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:5px;font-size:.85rem;color:var(--ink-2);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.steps button:hover{background:var(--surface)}
.steps button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--upn-line)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-strong);transform:translateY(1px)}
.dot.half{background:var(--upn);border-color:var(--upn-line)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.rail-foot{font-size:.78rem;color:var(--muted);padding:10px;border-top:1px solid var(--line);margin-top:10px}
.linkbtn{border:0;background:none;padding:0;color:var(--bad);text-decoration:underline;cursor:pointer;font-size:inherit}

main{min-width:0}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 34px 32px}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.pill{font-weight:700;border-radius:3px;padding:1px 8px;font-size:.74rem}
.pill.dark{background:var(--ink);color:#fff}
.pill.time{background:var(--upn);color:#000}
.pill.doc{background:var(--concept);color:#fff}
.screen h1{font-size:clamp(1.5rem,2.5vw,2.1rem);margin-bottom:6px;max-width:34ch}
.lead{font-size:1.05rem;color:var(--ink-2);margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:22px;margin-top:20px}

/* ---------- Secuencia didáctica ---------- */
.blk{position:relative;border:1px solid var(--line);border-radius:6px;padding:16px 20px 18px;background:var(--surface)}
.blk>header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.blk>header .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.76rem;font-weight:700;flex:none;background:var(--ink);color:#fff}
.blk>header .lab{font-size:.76rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.blk>header h3{font-size:1.08rem;margin:0}
.blk.sit{background:var(--surface-2)}
.blk.con{background:var(--concept-bg);border-color:transparent}
.blk.con>header .n{background:var(--concept)}
.blk.pred{border:2px solid var(--upn-line);background:var(--upn-soft)}
.blk.pred>header .n{background:var(--upn);color:#000}
.blk.int{border:2px solid var(--ink)}
.blk.res{background:var(--ok-bg);border-color:transparent}
.blk.res>header .n{background:var(--ok)}
.blk.expl{background:var(--surface-2)}
.blk.colab{background:#F1F1EC}
.blk.colab>header .n{background:#3B3B38}
.blk.doc{border:2px dashed var(--concept);background:var(--concept-bg)}
.blk.doc>header .n{background:var(--concept)}
.blk.solved{border-color:var(--ok)!important}
.blk ul,.blk ol{margin:.2em 0 .8em;padding-left:1.3em;max-width:72ch}
.blk li{margin:.25em 0}
details.more{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-weight:700;color:var(--info);font-size:.92rem}
details.more[open] summary{margin-bottom:8px}
.key{margin-top:10px;padding:10px 14px;background:var(--surface);border-left:4px solid var(--upn-line);border-radius:0 5px 5px 0;max-width:76ch}
.sim-tag{display:inline-block;font-size:.72rem;font-weight:700;border:1.5px solid var(--ink);border-radius:3px;padding:0 6px;margin-bottom:8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* ---------- Código ---------- */
.cw{margin:8px 0;border-radius:6px;overflow:hidden;background:var(--code-bg)}
.cbar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#2D2D2D;color:#CFCFCF;font-size:.78rem}
.code{color:var(--code-ink);font:14px/1.6 var(--f-code);padding:12px 16px;margin:0;overflow-x:auto;white-space:pre;tab-size:4}
:root.proj .code{font-size:17px}
.code .kw{color:var(--code-kw)} .code .fn{color:var(--code-fn)} .code .st{color:var(--code-str)}
.code .nm{color:var(--code-num)} .code .cm{color:var(--code-cm)} .code .pa{color:var(--code-par)}
.code input.blank{font:inherit;background:#333337;color:#FFE08A;border:0;border-bottom:2px solid var(--upn);padding:0 4px;min-width:4ch;border-radius:2px}
.code input.blank.ok{border-bottom-color:#4EC98A;color:#A8F0C8}
.code input.blank.bad{border-bottom-color:#FF6B86;color:#FFB3C1}
.mini{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:2px 9px;cursor:pointer;font-size:.8rem}
.cbar .mini{background:#3C3C3C;border-color:#5A5A5A;color:#fff}
.mini:disabled{opacity:.4;cursor:default}

/* ---------- Tablas ---------- */
.tw{overflow-x:auto;margin:6px 0}
table.rs{border-collapse:collapse;font-size:.9rem;min-width:100%}
table.rs th,table.rs td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.rs th{font-size:.78rem;color:var(--muted);border-bottom:2px solid var(--ink)}
table.rs .n{text-align:right;font-variant-numeric:tabular-nums}
table.rs tr.tot td{font-weight:700;background:var(--upn-soft)}
table.rs tr.hl td{background:var(--bad-bg)}
.null{font-family:var(--f-code);font-size:.8em;background:#ECEBE5;color:var(--muted);padding:1px 6px;border-radius:3px}

/* ---------- Actividades ---------- */
.q{font-weight:700;margin-bottom:10px;max-width:76ch}
.opts{display:grid;gap:8px;max-width:780px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .mk{flex:none;width:18px;height:18px;border:2px solid var(--line-strong);border-radius:50%;margin-top:2px}
.opt.multi .mk{border-radius:4px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--upn-soft)}
.opt[aria-pressed="true"] .mk{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok::after{content:"✓ correcta";margin-left:auto;font-size:.76rem;font-weight:700;color:var(--ok)}
.opt.bad::after{content:"✕ revisa";margin-left:auto;font-size:.76rem;font-weight:700;color:var(--bad)}
.grid-m{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:8px 14px;align-items:center;max-width:980px}
.grid-m .it{padding:7px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;font-size:.93rem}
select,input.f,textarea{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
select.ok,input.f.ok,textarea.ok{border-color:var(--ok);background:var(--ok-bg)}
select.bad,input.f.bad,textarea.bad{border-color:var(--bad);background:var(--bad-bg)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;max-width:880px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--ink-2)}
.fields.wide{grid-template-columns:1fr}
textarea{min-height:80px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.9rem}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--upn);border-color:var(--upn-line);color:#000}
.btn.ghost{border-color:var(--line-strong)}
.btn.docb{border-color:var(--concept);color:var(--concept)}
.btn:disabled{opacity:.45;cursor:default}
.fb{margin-top:12px;padding:10px 14px;border-radius:6px;max-width:80ch;font-size:.95rem}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb ul{margin:.3em 0 0;padding-left:1.2em;color:var(--ink)}
.fb .ttl{font-weight:700}
.hint{margin-top:10px;padding:10px 14px;border-radius:6px;background:var(--surface);border:1px solid var(--line);max-width:80ch}
.hint .h,.exp .h,.sol .h{display:block;font-size:.74rem;font-weight:700;margin-bottom:3px}
.hint .h{color:var(--info)}
.exp{margin-top:10px;padding:12px 14px;border-radius:6px;background:var(--info-bg);max-width:80ch}
.sol{margin-top:10px;padding:12px 14px;border-radius:6px;border:2px dashed var(--concept);background:var(--concept-bg);max-width:84ch}
.sol .h{color:var(--concept)}

/* ---------- Diagramas y simulaciones ---------- */
figure{margin:6px 0}
figure svg{display:block;width:100%;height:auto;max-width:100%}
figcaption{font-size:.84rem;color:var(--muted);margin-top:6px;max-width:76ch}
.fig-wrap{overflow-x:auto}
.svgt{font-family:var(--f);fill:currentColor}
.stage{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tab{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:4px 14px;cursor:pointer;font-weight:700;font-size:.86rem}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-strong);border-radius:99px;padding:3px 11px;font-size:.85rem;background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.out{font-family:var(--f-code);font-size:.88rem;background:#141414;color:#E9E9E3;border-radius:6px;padding:10px 14px;white-space:pre-wrap;min-height:2.6em}
.out b{color:var(--upn)}

/* Piezas del entorno */
.envmap{display:grid;gap:10px}
.envbox{border:2px solid var(--ink);border-radius:8px;padding:10px 12px;background:var(--surface)}
.envbox>.t{font-weight:700;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.envrow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.piece{border:1.5px solid var(--line-strong);border-radius:6px;background:var(--surface-2);padding:7px 12px;cursor:pointer;font-weight:700;font-size:.9rem;text-align:left}
.piece[aria-pressed="true"]{background:var(--upn);border-color:var(--upn-line);color:#000}
.piece small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.piece[aria-pressed="true"] small{color:#3a2a00}
.arrow-r{align-self:center;font-weight:700;color:var(--muted)}

/* Viajes y grupos (E01) */
.cards{display:flex;flex-wrap:wrap;gap:8px}
.tcard{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.86rem;min-width:118px;transition:transform .3s ease,opacity .3s ease}
.tcard b{display:block;font-size:.95rem}
.tcard.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--upn)}
.tcard.dim{opacity:.35}
.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.bucket{border:2px dashed var(--line-strong);border-radius:8px;padding:10px;min-height:150px;background:var(--surface)}
.bucket h4{font-size:.95rem;margin-bottom:6px}
.bucket .agg{font-family:var(--f-code);font-size:.85rem;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.colbtn{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--info);text-decoration:underline dotted;cursor:pointer}

/* RDD (E02) */
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.part{border:2px solid var(--p0);border-radius:8px;padding:10px;background:var(--surface)}
.part.p1{border-color:var(--p1)}
.part h4{font-size:.86rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.tup{display:inline-flex;gap:0;border:1.5px solid var(--line-strong);border-radius:6px;overflow:hidden;margin:3px;background:var(--surface);cursor:pointer;font-family:var(--f-code);font-size:.86rem;padding:0}
.tup span{padding:4px 8px}
.tup span+span{border-left:1px solid var(--line)}
.tup.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--upn)}
.tup.pass{background:var(--ok-bg);border-color:var(--ok)}
.tup.drop{opacity:.3}
.plan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:44px;padding:8px;border:2px dashed var(--line-strong);border-radius:8px;background:var(--surface)}
.node{border:1.5px dashed var(--ink);border-radius:6px;padding:4px 10px;font-family:var(--f-code);font-size:.84rem;background:var(--surface-2)}
.node.run{border-style:solid;background:var(--ok-bg);border-color:var(--ok)}
.shuffle{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:10px}
.lanes{display:grid;gap:6px}
.lane{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);font-family:var(--f-code);font-size:.84rem}

/* Calidad (E03) */
.rec{border:1.5px solid var(--line-strong);border-radius:6px;padding:8px 10px;background:var(--surface);font-family:var(--f-code);font-size:.84rem}
.reccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.reccard{border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.reccard .rec{border:0;padding:0}
.reccard.ok{border-color:var(--ok)} .reccard.bad{border-color:var(--bad)}

/* Gráficos y reporte */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.report{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.tile{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface)}
.tile h5{margin:0 0 6px;font-size:.95rem}
.tile.wide{grid-column:1/-1}
.kpi{font-size:2.3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:.8rem;color:var(--muted)}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:stretch}
.fstep{border-radius:8px;padding:10px;text-align:center;border:1.5px solid var(--line-strong);background:var(--surface)}
.fstep strong{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums}
.fstep span{font-size:.8rem;color:var(--muted)}
.fstep.y{background:var(--upn-soft);border-color:var(--upn-line)}
.fstep.g{background:var(--ok-bg);border-color:var(--ok)}
.fstep.r{background:var(--bad-bg);border-color:var(--bad)}
.timer{font-family:var(--f-code);font-size:1.6rem;font-weight:700}
.checkl{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.checkl label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checkl input{margin-top:4px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.medal{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:760px}
.medal div{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface-2)}
.medal b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.medal span{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#141414;color:#fff;padding:8px 16px;border-radius:6px;font-size:.88rem;z-index:50}

"use strict";
/* =======================================================================
   SIMULADOR TEMA 07 · Spark en Google Colab · CIIN1021P (UPN)
   Organización:
     0. Utilidades            3. Componentes visuales
     1. Datos del caso        4. Actividades (preguntas, respuestas, pistas)

/* =======================================================================
   0. UTILIDADES
   ======================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dec = (n, d = 2) => Number(n).toFixed(d);
const NULLC = '<span class="null">NULL</span>';
const stripAcc = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "");
/* Normaliza código para comparar: sin espacios sobrantes, mayúsculas, comillas unificadas. */
function normCode(s) {
  return stripAcc(s).replace(/[“”«»]/g, '"').replace(/[‘’]/g, "'").replace(/'/g, '"').trim().replace(/;+$/, "")
    .replace(/\s+/g, " ").replace(/\s*([(),=\[\]<>*+\/.-])\s*/g, "$1").toUpperCase();
}
const normTxt = s => stripAcc(s).toLowerCase().replace(/\s+/g, " ").trim();
function parseNum(v) {
  if (v == null) return NaN;
  let s = String(v).replace(/%/g, "").replace(/\s/g, "");
  if (!s) return NaN;
  if (s.includes(",") && s.includes(".")) s = s.replace(/,/g, ""); else s = s.replace(",", ".");
  return Number(s);
}
/* Resaltado estilo VS Code para Python y SQL */
function hl(text, lang = "py") {
  const KW = new Set((lang === "py"
    ? "def return lambda import from as with for in if else elif not and or assert print True False None is"
    : "SELECT FROM WHERE GROUP BY ORDER AS INNER LEFT JOIN ON AND OR NOT NULL DESC ASC").split(" "));
  const FN = new Set("COUNT SUM AVG ROUND count sum collect filter map reduceByKey parallelize glom getNumPartitions toDebugString read schema csv option printSchema show createOrReplaceTempView sql agg first dropDuplicates join withColumn when otherwise col isNull isin groupBy orderBy select distinct withColumnRenamed alias stddev_samp avg round write mode parquet explain builder appName master config getOrCreate range setLogLevel decode upload".split(" "));
  const re = lang === "py"
    ? /(#[^\n]*)|("""[\s\S]*?"""|'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w]*)|([\s\S])/g
    : /(--[^\n]*)|('(?:[^'\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w]*)|([\s\S])/g;
  let out = "", m;
  while ((m = re.exec(text))) {
    if (m[1]) out += '<span class="cm">' + esc(m[1]) + "</span>";
    else if (m[2]) out += '<span class="st">' + esc(m[2]) + "</span>";
    else if (m[3]) out += '<span class="nm">' + m[3] + "</span>";
    else if (m[4]) {
      const w = m[4], next = /^\s*\(/.test(text.slice(re.lastIndex));
      if (KW.has(w) || (lang === "sql" && KW.has(w.toUpperCase()) && w === w.toUpperCase())) out += '<span class="kw">' + esc(w) + "</span>";
      else if (FN.has(w) && next) out += '<span class="fn">' + esc(w) + "</span>";
      else out += esc(w);
    } else out += esc(m[5]);
  }
  return out;
}

/* Barras horizontales con etiqueta directa */
function hbars(rows, unit, maxV, fmt = v => dec(v, 3)) {
  const W = 560, x0 = 80, h = 30;
  let s = "";
  rows.forEach((r, i) => {
    const y = 6 + i * (h + 10), w = Math.max(2, (W - x0 - 90) * r.v / maxV);
    s += `<text x="${x0 - 8}" y="${y + 20}" text-anchor="end" font-size="13" style="fill:var(--ink-2)">${r.k}</text>
      <path d="M${x0} ${y}h${w - 4}q4 0 4 4v${h - 8}q0 4 -4 4h${-(w - 4)}z" style="fill:${r.c}"><title>${r.k}: ${fmt(r.v)} ${unit}</title></path>
      <text x="${x0 + w + 8}" y="${y + 20}" font-size="13" font-weight="700" style="fill:var(--ink)">${fmt(r.v)} ${unit}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${rows.length * (h + 10) + 8}" style="max-width:620px" role="img" aria-label="Gráfico de barras">${s}</svg>`;

function meanSdSVG() {

     <text x="${b + 8}" y="${y + 4}" font-size="12" style="fill:var(--ink)">${dec(d.media)} ± ${dec(d.sd)}</text>`;

/* =======================================================================
   5. VALIDADORES (respuestas controladas; nunca se ejecuta código)
   ======================================================================= */
const matchAcc = (n, acc) => acc.some(a => a instanceof RegExp ? a.test(n) : normCode(a) === n);
const V = {
  choice(d, st) { if (st.val.pick == null) return { ok: false, msgs: ["Elige una opción."] }; const o = d.opts[st.val.pick]; return { ok: !!o.ok, msgs: [o.fb || ""], mark: { [st.val.pick]: o.ok ? "ok" : "bad" } }; },
  multi(d, st) {
    const p = st.val.picks || []; if (!p.length) return { ok: false, msgs: ["Marca al menos una opción."] };
    const msgs = [], mark = {};
    p.forEach(i => { mark[i] = d.opts[i].ok ? "ok" : "bad"; if (!d.opts[i].ok) msgs.push(d.opts[i].fb || `«${d.opts[i].t}» no corresponde.`); });
    const miss = d.opts.filter((o, i) => o.ok && !p.includes(i)).length;
    if (miss) msgs.push(`Te falta${miss > 1 ? "n" : ""} ${miss} opción${miss > 1 ? "es" : ""} correcta${miss > 1 ? "s" : ""}.`);
    return { ok: !msgs.length, msgs, mark };
  },
  match(d, st) {
    const msgs = [], mark = {};
    d.items.forEach((it, i) => { const v = st.val["m" + i]; if (!v) { msgs.push(`Falta relacionar «${it.l}».`); return; } const ok = v === it.a; mark["m" + i] = ok ? "ok" : "bad"; if (!ok) msgs.push(`«${it.l}» no corresponde a «${v}».`); });
    return { ok: !msgs.length, msgs: msgs.slice(0, 5), mark };
  },
  cards(d, st) {
    const msgs = [], mark = {};
    d.cards.forEach((c, i) => { const v = st.val["c" + i]; if (!v) { msgs.push(`Falta clasificar: ${c.rec}.`); return; } const ok = v === c.a; mark["c" + i] = ok ? "ok" : "bad"; if (!ok) msgs.push(`${c.rec}: revisa el orden de las reglas.`); });
    return { ok: !msgs.length, msgs: msgs.slice(0, 5), mark };
  },
  fill(d, st) {
    const msgs = [], mark = {};
    Object.keys(d.blanks).forEach((k, i) => {
      const b = d.blanks[k], raw = st.val[k] || "", n = normCode(raw), lab = `Espacio ${i + 1}`;
      if (!raw.trim()) { msgs.push(`${lab}: está vacío.`); mark[k] = "bad"; return; }
      if (matchAcc(n, b.acc)) { mark[k] = "ok"; return; }
      mark[k] = "bad"; const w = (b.wrong || []).find(([re]) => re.test(n));
      msgs.push(`${lab}: ${w ? w[1] : "no coincide con lo que pide el comentario. Pide una pista si lo necesitas."}`);
    });
    return { ok: !msgs.length, msgs, mark };
  },
  fields(d, st) {
    const msgs = [], mark = {};
    d.fields.forEach(f => {
      const raw = String(st.val[f.k] || ""); if (!raw.trim()) { msgs.push(`«${f.l}»: falta completar.`); mark[f.k] = "bad"; return; }
      let ok;
      if (f.kind === "num") { const x = parseNum(raw); ok = !isNaN(x) && Math.abs(x - f.v) <= (f.tol ?? 0.005); if (!ok) msgs.push(`«${f.l}»: ${isNaN(x) ? "escribe solo un número." : "no coincide con el control esperado; revisa el cálculo."}`); }
      else if (f.kind === "select") { ok = f.ans.includes(raw); if (!ok) msgs.push(`«${f.l}»: no es la opción correcta.`); }
      else { const n = f.code ? normCode(raw) : normTxt(raw); ok = f.acc.some(a => (f.code ? normCode(a) : normTxt(a)) === n); if (!ok) msgs.push(`«${f.l}»: no coincide con la salida esperada.`); }
      mark[f.k] = ok ? "ok" : "bad";
    });
    return { ok: !msgs.length, msgs, mark };
  },
  text(d, st) {
    const msgs = [], mark = {};
    d.parts.forEach(p => { const n = normTxt(st.val[p.k] || ""); if (n.length < 12) { msgs.push(`«${p.l}»: escribe una respuesta más completa.`); mark[p.k] = "bad"; return; } const miss = p.rub.filter(r => !r.any.some(k => n.includes(k))); mark[p.k] = miss.length ? "bad" : "ok"; miss.forEach(r => msgs.push(`«${p.l}»: ${r.miss}`)); });
    return { ok: !msgs.length, msgs, mark };
  },
  mission(d, st) { const m = st.val.m || {}, pend = d.missions.filter(([k]) => !m[k]); return { ok: !pend.length, msgs: pend.map(([, t]) => "Pendiente: " + t) }; }
};
function applyMarks(id, res) {

/* ---- E02 · Plan perezoso ---- */
function rddState() { return S.sim.rdd || (S.sim.rdd = { plan: [], ran: {}, last: "" }); }
function rddMission(k) {
  const st = A("e2_plan"); st.val.m = st.val.m || {};
  if (!st.val.m[k]) { st.val.m[k] = true; save(); const ul = $("#e2_plan-mis"); if (ul) ul.innerHTML = missionItems("e2_plan"); if (ACT.e2_plan.missions.every(([q]) => st.val.m[q]) && !st.solved) validate("e2_plan"); }
}
SIMS.rdd = el => {
  const r = rddState(), has = k => r.plan.includes(k), show = r.last;
  const tupCls = x => { if (show === "count" || show === "sum") return PARES[x][0] === "Comas" ? "pass" : "drop"; return ""; };
  const part = k => `<div class="part ${k ? "p1" : ""}"><h4><span>Partición ${k}</span><small>RDD original · no cambia</small></h4>${PART[k].map(x => `<span class="tup ${tupCls(x)}" style="cursor:default"><span>'${PARES[x][0]}'</span><span>${PARES[x][1]}</span></span>`).join("")}</div>`;
  const node = (k, t) => has(k) ? `<span class="node ${r.ran[k] ? "run" : ""}">${t}${r.ran[k] ? " ✓ ejecutado" : " · pendiente"}</span>` : "";
  let out = "";
  if (show === "count") out = `comas.count() → <b>3</b>\nSe evaluó filter en las dos particiones: pasan ('Comas',15), ('Comas',20) y ('Comas',30).`;
  else if (show === "sum") out = `importes_comas.sum() → <b>65</b>\nfilter conserva Comas → map extrae importes [15, 20, 30] → sum = 15 + 20 + 30 = 65`;
  else if (show === "collect") out = `sorted(por_distrito.collect()) → <b>[('Comas', 65), ('Independencia', 25), ('Los Olivos', 30)]</b>\ncollect trae el resultado al driver (aquí solo 3 elementos).`;
  else out = r.plan.length ? "Hay transformaciones en el plan, pero ninguna acción: Spark todavía no procesó ninguna tupla." : "Agrega transformaciones al plan.";
  const shuffle = show === "collect" ? `<div class="shuffle"><div class="lanes"><div class="lane"><b>Partición 0</b> · suma local<br>Comas 15+20 = 35<br>Los Olivos 10</div><div class="lane"><b>Partición 1</b> · suma local<br>Los Olivos 20<br>Comas 30<br>Independencia 25</div></div>
    <div style="text-align:center;font-weight:700">→<br><small>redistribución<br>por clave</small></div>
    <div class="lanes"><div class="lane">Comas: 35 + 30 = <b>65</b></div><div class="lane">Independencia: <b>25</b></div><div class="lane">Los Olivos: 10 + 20 = <b>30</b></div></div></div><small>Reparto conceptual por clave; Spark decide internamente a qué partición va cada clave.</small>` : "";
  el.innerHTML = `<div class="envbox"><div class="t">RDD original: rdd = parallelize(datos, 2)</div><div class="parts">${part(0)}${part(1)}</div></div>
   <h4 style="margin:14px 0 6px;font-size:.9rem">Transformaciones (se agregan al plan)</h4>
   <div class="toolbar"><button type="button" class="btn" data-rd="f" ${has("f") ? "disabled" : ""}>+ filter(fila[0] == 'Comas')</button><button type="button" class="btn" data-rd="m" ${has("m") || !has("f") ? "disabled" : ""}>+ map(fila[1])</button><button type="button" class="btn" data-rd="r" ${has("r") ? "disabled" : ""}>+ reduceByKey(a + b)</button></div>
   <div class="plan" aria-live="polite"><span class="node" style="border-style:solid">rdd</span>${has("f") ? "→" : ""}${node("f", "comas = filter")}${has("m") ? "→" : ""}${node("m", "importes_comas = map")}${has("r") ? '<span style="margin-left:14px">rdd →</span>' : ""}${node("r", "por_distrito = reduceByKey")}${r.plan.length ? "" : '<small>Plan vacío</small>'}</div>
   <h4 style="margin:14px 0 6px;font-size:.9rem">Acciones (piden un resultado)</h4>
   <div class="toolbar"><button type="button" class="btn pri" data-rd="count" ${has("f") ? "" : "disabled"}>comas.count()</button><button type="button" class="btn pri" data-rd="sum" ${has("m") ? "" : "disabled"}>importes_comas.sum()</button><button type="button" class="btn pri" data-rd="collect" ${has("r") ? "" : "disabled"}>por_distrito.collect()</button><button type="button" class="btn ghost" data-rd="reset">Vaciar plan</button></div>
   <div class="out" aria-live="polite">${out}</div>${shuffle}`;
};
function rddAction(k) {
  const r = rddState();
  if (k === "reset") { S.sim.rdd = { plan: [], ran: {}, last: "" }; }
  else if (["f", "m", "r"].includes(k)) { if (!r.plan.includes(k)) r.plan.push(k); r.last = ""; rddMission(k); }
  else { r.last = k; if (k === "count") r.ran.f = true; if (k === "sum") { r.ran.f = true; r.ran.m = true; } if (k === "collect") r.ran.r = true; rddMission(k); }
  save(); rerender("rdd");
}

  2: ["Explica con tus palabras por qué la tasa de aceptación usa 1804 como denominador.", "Explica por qué no se suman NumVoluntarios por pesaje ni las medias regionales.", "Explica qué decisión apoya el reporte y qué no permite concluir."]
};
function cierreHTML(ses) {
  const ids = ACT_IDS.filter(id => SES_MODS[ses].includes(modOf(id))), st = stats(ids);
  const cs = [...new Set(ids.map(id => ACT[id].c))], L = { dom: "Dominado", rep: "Repasar", pen: "Pendiente" };
  return `<section class="blk res"><header><span class="lab">Logros de la sesión ${ses}</span></header>
    <div class="medal"><div><b>${st.solved}/${st.n}</b><span>actividades resueltas</span></div><div><b>${st.first}</b><span>al primer intento</span></div><div><b>${st.hints}</b><span>pistas usadas</span></div><div><b>${st.sols}</b><span>soluciones docentes abiertas</span></div></div>
    <ul class="checkl" style="margin-top:12px">${cs.map(c => { const s = conceptStatus(c); return `<li><span class="pill ${s === "dom" ? "dark" : s === "rep" ? "time" : ""}" style="${s === "pen" ? "border:1px solid var(--line-strong)" : ""}">${L[s]}</span> ${esc(CONCEPTOS[c])}</li>`; }).join("")}</ul>
    <p style="margin-top:8px"><small>Dominado: resuelto sin abrir la solución docente y con una pista o menos por actividad, en promedio.</small></p></section>
   <section class="blk colab"><header><span class="lab">Evidencias de la sesión ${ses}</span></header><ul class="checkl">${EVID[ses].map((e, i) => `<li><label><input type="checkbox" id="ev${ses}-${i}" data-ev="${ses}-${i}" ${S.ev[ses + "-" + i] ? "checked" : ""}> <span>${esc(e)}</span></label></li>`).join("")}</ul>
    <p style="margin-top:8px"><small>Descarga el cuaderno y los archivos antes de cerrar Colab: la máquina es temporal.</small></p></section>
   <section class="blk pred"><header><span class="lab">Con tus propias palabras</span></header><div class="fields wide">${PROPIAS[ses].map((q, i) => `<label for="np${ses}-${i}">${esc(q)}<textarea id="np${ses}-${i}" data-note="${ses}-${i}">${esc(S.notes[ses + "-" + i] || "")}</textarea></label>`).join("")}</div><small>Borrador que se guarda en este navegador; pásalo a tu cuaderno.</small></section>`;
}
function fuentesHTML() {

    ["Guía de actividades del estudiante · Laboratorio 06 y 07 (Colab)", ""], ["Guía docente resuelta · Laboratorio 06 y 07", ""],
    ["Cuadernos Lab07_Sesion1 y Lab07_Sesion2 (estudiante y docente) y datos_tema07.zip", ""],
    ["Apache Spark 4.0.3 · Instalación de PySpark", "https://spark.apache.org/docs/4.0.3/api/python/getting_started/install.html"],

   <p><small>Base curricular indicada en la guía: sílabo CIIN1021P, subtemas 7.1 a 7.4; guía oficial GUIALAB20261_TEMA7_CIIN1021P. Todas las salidas de este simulador son simulaciones didácticas calculadas en el navegador.</small></p></section>`;

/* =======================================================================
   EVENTOS
   ======================================================================= */
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.go) { go(b.dataset.go); return; }
  const id = b.dataset.act;
  if (b.dataset.do) {
    const d = b.dataset.do;
    if (d === "val") validate(id); else if (d === "hint") giveHint(id, b); else if (d === "exp") toggleExp(id, b);
    else if (d === "sol") toggleSol(id, b); else if (d === "reset") resetAct(id);
    else if (d === "resetall") $("#resetZone").innerHTML = `¿Borrar todo el avance? <button type="button" class="linkbtn" data-do="resetyes">Sí, borrar</button> · <button type="button" class="linkbtn" style="color:var(--ink)" data-do="resetno">No</button>`;
    else if (d === "resetyes") { const pj = S.proj, dc = S.doc; S = FRESH(); S.proj = pj; S.doc = dc; save(); go("s1a"); toast("Avance reiniciado"); }
    else if (d === "resetno") renderRail();
    return;
  }
  if (b.dataset.opt != null) {
    const d = ACT[id], st = A(id), i = +b.dataset.opt;
    if (d.type === "choice") { st.val.pick = i; $$(`[data-act="${id}"][data-opt]`).forEach(o => { o.setAttribute("aria-pressed", o === b); o.classList.remove("ok", "bad"); }); }
    else { const p = st.val.picks || (st.val.picks = []), k = p.indexOf(i); k >= 0 ? p.splice(k, 1) : p.push(i); b.setAttribute("aria-pressed", k < 0); $$(`[data-act="${id}"][data-opt]`).forEach(o => o.classList.remove("ok", "bad")); }
    save(); return;
  }
  if (b.dataset.copy != null) {
    const txt = COPYBUF[+b.dataset.copy];
    const fallback = () => { const pre = b.closest(".cw").querySelector("pre"); const rg = document.createRange(); rg.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Código seleccionado: usa Ctrl+C"); };
    try { navigator.clipboard.writeText(txt).then(() => { b.textContent = "Copiado ✓"; setTimeout(() => b.textContent = "Copiar", 1500); }, fallback); } catch (e) { fallback(); }
    return;
  }
  if (b.dataset.env) { S.sim.env = b.dataset.env; save(); rerender("env"); $(`[data-env="${b.dataset.env}"]`)?.focus(); return; }
  if (b.dataset.vt) { S.sim.v.tab = b.dataset.vt; save(); rerender("viajes"); $(`[data-vt="${b.dataset.vt}"]`)?.focus(); return; }
  if (b.dataset.col) { S.sim.v.col = b.dataset.col; save(); rerender("viajes"); $(`[data-col="${b.dataset.col}"]`)?.focus(); return; }
  if (b.dataset.vg) { const v = S.sim.v; v.step = b.dataset.vg === "reset" ? 0 : b.dataset.vg === "all" ? 6 : Math.min(6, (v.step || 0) + 1); save(); rerender("viajes"); $(`[data-vg="${v.step >= 6 ? "reset" : "play"}"]`)?.focus(); return; }
  if (b.dataset.tup != null) { S.sim.tsel = +b.dataset.tup; save(); rerender("tuplas"); $(`[data-tup="${b.dataset.tup}"]`)?.focus(); return; }
  if (b.dataset.rd) { rddAction(b.dataset.rd); return; }
  if (b.dataset.tm) { S.sim.tonm = b.dataset.tm; save(); rerender("ton"); return; }
  if (b.dataset.vm) { S.sim.volm = b.dataset.vm; save(); rerender("vol"); return; }
  if (b.dataset.st) { S.sim.sumTry = true; save(); rerender("stats"); return; }
  if (b.dataset.pq) { S.sim.pqOpen = !S.sim.pqOpen; save(); rerender("parquet"); $("[data-pq]")?.focus(); return; }
  if (b.dataset.rr) { const r = S.sim.rep, x = b.dataset.rr; r.regs = r.regs.includes(x) ? r.regs.filter(y => y !== x) : REGIONES.filter(y => r.regs.includes(y) || y === x); save(); rerender("report"); $(`[data-rr="${x}"]`)?.focus(); return; }
  if (b.dataset.rds) { S.sim.rep.ds = b.dataset.rds; save(); rerender("report"); return; }
  if (b.dataset.rt) {
    const t = S.sim.reto;
    if (b.dataset.rt === "reset") { t.left = 900; t.run = false; } else { if (t.left === 0) t.left = 900; t.run = !t.run; }
    save(); if (t.run && !retoTimer) retoTimer = setInterval(retoTick, 1000); rerender("reto"); return;
  }
});
function onInput(ev) {
  const el = ev.target;
  if (el.dataset.act && el.dataset.k) { A(el.dataset.act).val[el.dataset.k] = el.value; el.classList.remove("ok", "bad"); if (el.classList.contains("blank")) el.size = Math.max(+el.getAttribute("size") || 4, el.value.length + 1); save(); return; }
  if (el.dataset.note) { S.notes[el.dataset.note] = el.value; save(); return; }
  if (el.dataset.ev) { S.ev[el.dataset.ev] = el.checked; save(); return; }
  if (el.dataset.rc) { S.sim.reto.chk[el.dataset.rc] = el.checked; save(); return; }
}
document.addEventListener("input", onInput);
document.addEventListener("change", ev => { if (ev.target.tagName === "SELECT" || ev.target.type === "checkbox") onInput(ev); });
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.matches("input.blank, input.f")) { ev.preventDefault(); validate(ev.target.dataset.act); } });

function applyPrefs() {
  document.documentElement.classList.toggle("proj", !!S.proj);
  $("#projBtn").setAttribute("aria-pressed", !!S.proj);
  $("#docBtn").setAttribute("aria-pressed", !!S.doc);
  $("#docBtn").textContent = S.doc ? "Ocultar solución docente" : "Mostrar solución docente";
}
$("#projBtn").addEventListener("click", () => { S.proj = !S.proj; save(); applyPrefs(); });
$("#docBtn").addEventListener("click", () => { S.doc = !S.doc; save(); applyPrefs(); renderAll(); toast(S.doc ? "Modo docente activo: organiza la explicación; no es un sistema de seguridad" : "Modo docente desactivado"); });
$("#menuBtn").addEventListener("click", () => { const o = $("#rail").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); });

window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h in SCR_IDX && h !== S.scr) go(h); });
applyPrefs();
if (S.sim.reto) S.sim.reto.run = false;
const hash = (location.hash || "").slice(1);
go(hash in SCR_IDX ? hash : S.scr, false);
</script>
